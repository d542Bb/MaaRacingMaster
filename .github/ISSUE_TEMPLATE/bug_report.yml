name: 🐛 Bug 报告
description: 报告一个使用中遇到的问题
title: "[Bug] 简短的标题"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug 报告！请尽量提供完整信息，方便我们快速定位问题。
        提交前请先在 [Issues](https://github.com/d542Bb/MaaRacingMaster/issues) 搜索是否已有重复报告。

  - type: input
    id: version
    attributes:
      label: 版本信息
      description: 使用的版本号（如 v0.14.0-dev.2，可在 GUI「关于」页查看）
      placeholder: "v0.14.0-dev.2"
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      description: 出问题的是哪个模块？
      options:
        - 巅峰鉴宝
        - 平台 / GUI 通用
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何触发这个问题？请按步骤描述。
      placeholder: |
        1. 打开游戏到主界面（1280×720）
        2. 选择「巅峰鉴宝」...
        3. 点击「开始运行」
        4. 出现 ...
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？（可附截图 / 日志 / 调试帧）
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 环境信息
      description: 操作系统、Python 版本、显卡、游戏分辨率、是否管理员运行等
      placeholder: |
        - 系统：Windows 11 23H2
        - Python：3.11
        - 显卡：RTX 4060 (DirectML)
        - 分辨率：1280×720
        - 管理员运行：是
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 粘贴关键日志（INFO/ERROR）或附上调试截图（PEEP 预览 / debug 存盘）。可拖拽图片到此处。
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 补充说明
      description: 其他想补充的信息
    validations:
      required: false
