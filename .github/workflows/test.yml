# =============================================================================
# CI 自动化单测 — push 与 PR 时运行
# 只安装测试必要依赖（pytest），不拉重量级依赖（maa/opencv/onnxruntime 等）
# 避免拉满 requirements.txt 拖慢 CI；单测仅覆盖纯逻辑模块（bid_strategy）
# =============================================================================
name: Test

on:
  push:
    branches:
      - master
      - 'release/**'
  pull_request:

jobs:
  test:
    name: 单元测试 (pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 仓库体积守卫（跟踪文件不得超过 5 MB）
        # 机制：git 历史只增不减——误提交的大文件永久留在 pack 里，并随每一次
        # clone / 每一次 CNB 镜像分发。项目规范禁止改写已推送历史，故无法事后补救，
        # 唯一防线是在首次合入前拦住。阈值 5 MB 远低于 GitHub 的 100 MB 硬拒线，
        # 留出余量给后续版本的增量 blob。
        # 口径用 git ls-tree -l 的对象大小：文本按 .gitattributes 归一（LF）后的
        # 实际入库体积计，不受 runner 上 core.autocrlf 影响。
        run: |
          LIMIT=$((5 * 1024 * 1024))
          git ls-tree -r -l HEAD \
            | awk -v max="$LIMIT" '$4 ~ /^[0-9]+$/ && $4+0 > max { printf "%12d  %s\n", $4, $NF }' \
            > big-files.txt
          if [ -s big-files.txt ]; then
            echo "::error::以下跟踪文件超过 5 MB，请改为忽略（用生成脚本 + 锁文件重建）、或走 Git LFS / Release 附件承载："
            cat big-files.txt
            exit 1
          fi
          COUNT=$(git ls-files | wc -l)
          echo "✓ ${COUNT} 个跟踪文件均 ≤ 5 MB"

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 校验 NavKit 路由编译产物（--check）
        # 契约：各模块 <m>_routes.json 由 <m>_assets.json 编译生成，改资产必须重编译。
        # --all 自动扫描 plugins/ 全部 v3 资产，新模块接入无需改动本工作流。
        # core/navkit 为纯标准库包，本步骤零依赖直接运行，防生成物与资产源漂移。
        run: python tools/navkit/compile_routes.py --all --check

      - name: 安装 pytest 与轻量测试依赖
        # 注：不采用 `pip install -e .[test]`——会连带安装主依赖（onnxruntime-directml /
        # windows-capture 等仅 Windows 有 wheel），Linux runner 装不上。故只装 pytest +
        # 测试实际需要的轻量依赖（numpy：capabilities 顶层 import；opencv-headless：
        # tools/navkit/server 顶层 import cv2——均有 Linux wheel）。
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=7.0" numpy opencv-python-headless

      - name: 运行单元测试
        run: python -m pytest tests -v