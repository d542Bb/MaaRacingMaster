# =============================================================================
# CI 自动化单测 — push 与 PR 时运行
# 只安装测试必要依赖（pytest），不拉重量级依赖（maa/opencv/onnxruntime 等）
# 避免拉满 requirements.txt 拖慢 CI；单测仅覆盖纯逻辑模块（bid_strategy）
# =============================================================================
name: Test

on:
  push:
    branches:
      - master
      - 'release/**'
  pull_request:

jobs:
  test:
    name: 单元测试 (pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 仓库体积守卫（跟踪文件不得超过 5 MB）
        # 机制：git 历史只增不减——误提交的大文件永久留在 pack 里，并随每一次
        # clone / 每一次 CNB 镜像分发。项目规范禁止改写已推送历史，故无法事后补救，
        # 唯一防线是在首次合入前拦住。阈值 5 MB 远低于 GitHub 的 100 MB 硬拒线，
        # 留出余量给后续版本的增量 blob。
        # 口径用 git ls-tree -l 的对象大小：文本按 .gitattributes 归一（LF）后的
        # 实际入库体积计，不受 runner 上 core.autocrlf 影响。
        run: |
          LIMIT=$((5 * 1024 * 1024))
          git ls-tree -r -l HEAD \
            | awk -v max="$LIMIT" '$4 ~ /^[0-9]+$/ && $4+0 > max { printf "%12d  %s\n", $4, $NF }' \
            > big-files.txt
          if [ -s big-files.txt ]; then
            echo "::error::以下跟踪文件超过 5 MB，请改为忽略（用生成脚本 + 锁文件重建）、或走 Git LFS / Release 附件承载："
            cat big-files.txt
            exit 1
          fi
          COUNT=$(git ls-files | wc -l)
          echo "✓ ${COUNT} 个跟踪文件均 ≤ 5 MB"

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 校验 v4 真源自洽（图闭合 + 数据面装配 + 交叉互洽）
        # check_truth 为纯标准库工具，本步骤零依赖直接运行；
        # 运行时读取路径由金标测试（test_navkit_v2_v3_runtime_equiv）看护。
        run: python tools/navkit/check_truth.py

      - name: 安装 pytest 与轻量测试依赖
        # 注：不采用 `pip install -e .[test]`——会连带安装主依赖（onnxruntime-directml /
        # windows-capture 等仅 Windows 有 wheel），Linux runner 装不上。故只装 pytest +
        # 测试实际需要的轻量依赖（numpy：capabilities 顶层 import；opencv-headless：
        # 生产模块 detector/clicker 等顶层 import cv2——均有 Linux wheel）。
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=7.0" numpy opencv-python-headless

      - name: 静态检查（ruff：错误级 + Pyflakes）
        # 规则集与存量清零口径见 pyproject.toml [tool.ruff]——E4/E7/E9/F 全仓 0 违规，
        # 新增违规即 CI 红。格式类规则（ruff format）不在门禁内：存量代码无统一格式
        # 约定，一次性重排会淹没 review 信号；要引入时单独决策。
        run: |
          pip install "ruff==0.16.7"
          ruff check .

      - name: 类型检查（pyright basic，主包）
        # pyrightconfig.json 为唯一配置源；依赖只装轻量集（同测试步骤的口径），
        # maa/windows-capture 等 Windows-only 包缺失时按 reportMissingImports=warning
        # 降级，不阻塞。treasure 域冻结豁免声明在 module.py/detector.py 文件头。
        run: |
          pip install "pyright==1.1.411"
          pyright maaracing_master

      - name: 运行单元测试
        run: python -m pytest tests -v