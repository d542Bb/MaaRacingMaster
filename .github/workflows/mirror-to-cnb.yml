name: Mirror to CNB

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

# 串行化：发版时序（release.yml 回写 master + tag push）会连续触发本流水线，
# git push --mirror 若并发会互相覆盖/竞态——同一时刻只允许一个同步在跑。
concurrency:
  group: cnb-sync
  cancel-in-progress: false

# 只读检出 + 推到 CNB 外部远端（凭据走 secrets），不需要任何 GitHub 令牌写权限。
permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to CNB
        env:
          CNB_URL: https://${{ secrets.CNB_USER }}:${{ secrets.CNB_TOKEN }}@cnb.cool/${{ secrets.CNB_ORG }}/${{ secrets.CNB_REPO }}.git
        run: |
          git remote add cnb "$CNB_URL"
          # 不用 --mirror：它带删除语义（prune 远程多余 refs），CNB 拒绝删除默认分支
          # master（refusing to delete the current branch）导致 tag-push 触发时恒红。
          # 显式 refspec + force 只同步更新 heads/tags，不做删除。
          git push cnb --force "refs/heads/*:refs/heads/*" "refs/tags/*:refs/tags/*"
          git remote remove cnb
