<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>活动模块下拉试验区 · step 1 —— OriginUI 风格 combobox</title>
<style>
/* ==== 本文件 = 生产「活动模块」卡的复刻：令牌复制自 frontend/style.css。
     原生 select 隐藏作值真源（现有读写点零改动），自绘层经 sync() 单向投影。 ==== */
:root {
  --mra-primary: #E5484D;
  --mra-primary-foreground: #FFFFFF;
  --mra-background: #F5F6FA;
  --mra-surface: #FFFFFF;
  --mra-surface-hover: #F8F9FC;
  --mra-sidebar: #FAFBFD;
  --mra-foreground: #1F2328;
  --mra-foreground-secondary: #4A5160;
  --mra-foreground-muted: #8B93A7;
  --mra-foreground-dim: #B0B7C3;
  --mra-border: #E5E7EB;
  --mra-border-light: #EEF0F4;
  --mra-success: #10B981;
  --mra-danger: #EF4444;
  --mra-radius-sm: 6px;
  --mra-radius-md: 8px;
  --mra-duration-fast: 0.15s;
  --mra-duration-base: 0.2s;
  --mra-font-sans: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
  --mra-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--mra-background); color: var(--mra-foreground);
  font-family: var(--mra-font-sans); font-size: 13px; line-height: 1.5;
  user-select: none; display: flex; padding: 24px; gap: 24px;
}
:focus-visible { outline: 2px solid var(--mra-primary); outline-offset: 2px; }

.card {
  background: var(--mra-surface); border: 1px solid var(--mra-border);
  border-radius: var(--mra-radius-md); box-shadow: var(--mra-shadow-sm);
  width: 430px; height: fit-content;
}
.card-head { padding: 14px 16px 10px; }
.card-head h3 { font-size: 14px; font-weight: 600; }
.card-body { padding: 0 16px 16px; }
.module-desc { font-size: 12px; color: var(--mra-foreground-secondary); margin-top: 8px; line-height: 1.6; }

/* ==== combobox：触发器 ==== */
.msel { position: relative; }
.msel-native { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.msel-trigger {
  width: 100%; height: 40px; padding: 0 40px 0 14px;
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--mra-border); border-radius: var(--mra-radius-md);
  background: var(--mra-surface); color: var(--mra-foreground);
  font-size: 13px; font-family: inherit; text-align: left;
  cursor: pointer;
  transition: border-color var(--mra-duration-fast) ease;
}
.msel-trigger:hover:not([aria-disabled="true"]) { border-color: var(--mra-foreground-dim); }
.msel-trigger[aria-expanded="true"] { border-color: var(--mra-primary); }
.msel-trigger[aria-disabled="true"] { opacity: 0.6; cursor: not-allowed; }
.msel-label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msel-label--empty { color: var(--mra-foreground-muted); }
.msel-chev {
  position: absolute; right: 12px; top: 50%;
  width: 16px; height: 16px; color: var(--mra-foreground-muted);
  transform: translateY(-50%) rotate(0deg); pointer-events: none;
  transition: transform var(--mra-duration-base) cubic-bezier(0.22, 1, 0.36, 1);
}
.msel-trigger[aria-expanded="true"] .msel-chev { transform: translateY(-50%) rotate(180deg); }

/* ==== combobox：面板（等宽浮层，选项行圆角 hover，选中=checkmark+加粗） ==== */
.msel-list {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30;
  max-height: 280px; overflow-y: auto;
  background: var(--mra-surface); border: 1px solid var(--mra-border);
  border-radius: 10px; padding: 4px;
  box-shadow: 0 8px 24px rgba(31, 35, 40, 0.12), 0 2px 6px rgba(31, 35, 40, 0.08);
  display: none;
}
.msel--open .msel-list { display: block; animation: msel-in var(--mra-duration-base) ease-out; }
@keyframes msel-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .msel--open .msel-list { animation: none; } }
.msel-opt {
  position: relative; display: flex; align-items: center;
  height: 34px; padding: 0 10px 0 32px;
  border-radius: var(--mra-radius-sm); cursor: pointer; color: var(--mra-foreground);
}
.msel-opt--active { background: var(--mra-surface-hover); }
.msel-opt--selected { font-weight: 600; }
.msel-opt--selected::before {
  content: ''; position: absolute; left: 9px; top: 50%;
  width: 12px; height: 7px; margin-top: -8px;
  border-left: 2px solid var(--mra-primary); border-bottom: 2px solid var(--mra-primary);
  transform: rotate(-45deg);
}
.msel-opt--expired { color: var(--mra-foreground-secondary); }
.msel-suffix { margin-left: auto; font-size: 11px; color: var(--mra-foreground-muted); padding-left: 8px; }

/* 演示开关条（非交付物，只为验收「运行中禁用」态） */
.demo-bar { width: 430px; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--mra-foreground-muted); }
.demo-bar button { height: 28px; padding: 0 10px; border: 1px solid var(--mra-border); border-radius: var(--mra-radius-sm); background: var(--mra-surface); cursor: pointer; font-family: inherit; }
</style>
</head>
<body>
<div class="card">
  <div class="card-head"><h3>活动模块</h3></div>
  <div class="card-body">
    <div class="msel" id="msel">
      <!-- 值真源 = 原生 select（生产里由 app.js 填充、run.js 读取，此处模拟同款数据） -->
      <select id="module-select" class="msel-native" aria-hidden="true">
        <option value="speedrush">speedrush — 极速狂飙</option>
        <option value="treasure">treasure — 巅峰鉴宝</option>
        <option value="racing" data-expired="1">racing — 巅峰竞速（已过期）</option>
        <option value="">（空）</option>
      </select>
      <button type="button" class="msel-trigger" id="msel-trigger"
              role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="msel-list">
        <span class="msel-label" id="msel-label"></span>
        <svg class="msel-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="msel-list" id="msel-list" role="listbox" tabindex="-1"></div>
    </div>
    <p class="module-desc" id="module-desc"></p>
  </div>
</div>
<div class="demo-bar">
  <button id="demo-running">模拟运行中（禁用切换）</button>
  <span>键盘：Enter/Space/↓ 开 · ↑↓/Home/End/首字母 移动 · Enter 选中 · Esc 关闭</span>
</div>

<script>
// ==== 自绘 combobox 层：只读原生 select 的 options/value/disabled，选择结果写回
//      原生 select 并派发 change——现有读写点（app.js 填充 / run.js 取值 /
//      settings.js 禁用 / onchange 确认弹窗）全部零改动。 ====
(function () {
  'use strict';
  const native = document.getElementById('module-select');
  const wrap = document.getElementById('msel');
  const trigger = document.getElementById('msel-trigger');
  const list = document.getElementById('msel-list');
  const labelEl = document.getElementById('msel-label');
  const descEl = document.getElementById('module-desc');
  const DESCS = { speedrush: '录制与观察极速狂飙赛事数据', treasure: '巅峰鉴宝：截图 + 记录 + 选鉴宝师自动化', racing: '巅峰竞速（活动已过期，仍可强制选择）', '': '未选择活动模块' };
  let open = false, active = -1;

  function opts() { return Array.from(native.options); }
  function renderList() {
    list.innerHTML = '';
    opts().forEach((o, i) => {
      const row = document.createElement('div');
      row.className = 'msel-opt'
        + (o.value === native.value ? ' msel-opt--selected' : '')
        + (o.dataset.expired ? ' msel-opt--expired' : '')
        + (i === active ? ' msel-opt--active' : '');
      row.id = 'msel-opt-' + i;
      row.setAttribute('role', 'option');
      row.setAttribute('aria-selected', o.value === native.value ? 'true' : 'false');
      const txt = document.createElement('span');
      txt.textContent = o.textContent.replace(/（已过期）$/, '');
      row.appendChild(txt);
      if (o.dataset.expired) {
        const sfx = document.createElement('span');
        sfx.className = 'msel-suffix';
        sfx.textContent = '已过期';
        row.appendChild(sfx);
      }
      row.addEventListener('mousedown', (e) => { e.preventDefault(); pick(i); });
      row.addEventListener('mousemove', () => { if (active !== i) { active = i; paintActive(); } });
      list.appendChild(row);
    });
  }
  function paintActive() {
    Array.from(list.children).forEach((el, i) => el.classList.toggle('msel-opt--active', i === active));
    trigger.setAttribute('aria-activedescendant', open && active >= 0 ? 'msel-opt-' + active : '');
    if (active >= 0 && list.children[active]) list.children[active].scrollIntoView({ block: 'nearest' });
  }
  function renderLabel() {
    const o = native.options[native.selectedIndex];
    const text = o ? o.textContent.replace(/（已过期）$/, '') : '';
    labelEl.textContent = text;
    labelEl.classList.toggle('msel-label--empty', native.value === '');
    descEl.textContent = DESCS[native.value] || '';
  }
  function setOpen(v) {
    open = v;
    wrap.classList.toggle('msel--open', v);
    trigger.setAttribute('aria-expanded', v ? 'true' : 'false');
    if (v) {
      active = opts().findIndex((o) => o.value === native.value);
      renderList(); paintActive();
    } else { active = -1; }
  }
  function pick(i) {
    const o = opts()[i];
    if (!o) return;
    native.value = o.value;
    native.dispatchEvent(new Event('change', { bubbles: true }));
    setOpen(false); trigger.focus();
  }
  function move(d) {
    const n = opts().length;
    active = active < 0 ? (d > 0 ? 0 : n - 1) : (active + d + n) % n;
    paintActive();
  }
  trigger.addEventListener('click', () => {
    if (trigger.getAttribute('aria-disabled') === 'true') return;
    setOpen(!open);
  });
  trigger.addEventListener('keydown', (e) => {
    if (trigger.getAttribute('aria-disabled') === 'true') return;
    const k = e.key;
    if (!open && (k === 'Enter' || k === ' ' || k === 'ArrowDown' || k === 'ArrowUp')) {
      e.preventDefault(); setOpen(true); return;
    }
    if (!open) return;
    if (k === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (k === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (k === 'Home') { e.preventDefault(); active = 0; paintActive(); }
    else if (k === 'End') { e.preventDefault(); active = opts().length - 1; paintActive(); }
    else if (k === 'Enter' || k === ' ') { e.preventDefault(); pick(active); }
    else if (k === 'Escape') { e.preventDefault(); setOpen(false); trigger.focus(); }
    else if (k === 'Tab') { setOpen(false); }
    else if (k.length === 1 && /\S/.test(k)) {
      const idx = opts().findIndex((o) => o.textContent.toLowerCase().startsWith(k.toLowerCase()));
      if (idx >= 0) { e.preventDefault(); active = idx; paintActive(); }
    }
  });
  document.addEventListener('mousedown', (e) => {
    if (open && !wrap.contains(e.target)) setOpen(false);
  });
  native.addEventListener('change', () => { renderLabel(); if (open) renderList(); });
  function sync() {
    trigger.setAttribute('aria-disabled', native.disabled ? 'true' : 'false');
    trigger.title = native.title || '';
    if (native.disabled && open) setOpen(false);
    renderLabel();
  }
  document.getElementById('demo-running').addEventListener('click', (e) => {
    native.disabled = !native.disabled;
    e.target.textContent = native.disabled ? '解除运行中状态' : '模拟运行中（禁用切换）';
    sync();
  });
  sync();
  window.__mselSync = sync; // 生产集成时由 app.js 填充后 / settings.js 禁用后调用
})();
</script>
</body>
</html>
