<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>日志卡试验区 · step 6 —— 终态：卡只来自组，散行=裸行</title>
<style>
/* ==== 生产日志卡复刻基线：token 复制自 frontend/style.css；渲染管线与生产 js/log.js
     同构（双 renderer + 交接锁），并叠加试验区设计步进（step 1 状态槽、step 2 事件驱动）。
     每步设计改动一个 commit。 ==== */
:root {
  --mra-primary: #E5484D;
  --mra-primary-foreground: #FFFFFF;
  --mra-background: #F5F6FA;
  --mra-surface: #FFFFFF;
  --mra-surface-hover: #F8F9FC;
  --mra-sidebar: #FAFBFD;
  --mra-foreground: #1F2328;
  --mra-foreground-secondary: #4A5160;
  --mra-foreground-muted: #8B93A7;
  --mra-foreground-dim: #B0B7C3;
  --mra-border: #E5E7EB;
  --mra-border-light: #EEF0F4;
  --mra-success: #10B981;
  --mra-success-bg: rgba(16, 185, 129, 0.1);
  --mra-success-strong: #15803d;
  --mra-warning: #F59E0B;
  --mra-warning-bg: rgba(245, 158, 11, 0.1);
  --mra-warning-strong: #b45309;
  --mra-danger: #EF4444;
  --mra-danger-bg: rgba(239, 68, 68, 0.1);
  --mra-info: #3B82F6;
  --mra-radius-sm: 6px;
  --mra-radius-md: 8px;
  --mra-duration-fast: 0.15s;
  --mra-duration-base: 0.2s;
  --mra-font-sans: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
  --mra-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--mra-background); color: var(--mra-foreground);
  font-family: var(--mra-font-sans); font-size: 13px; line-height: 1.5;
  user-select: none; display: flex; padding: 24px;
}
:focus-visible { outline: 2px solid var(--mra-primary); outline-offset: 2px; }

.card {
  background: var(--mra-surface); border: 1px solid var(--mra-border);
  border-radius: var(--mra-radius-md); box-shadow: var(--mra-shadow-sm);
  display: flex; flex-direction: column; overflow: hidden;
  width: 430px; height: calc(100vh - 48px); margin: 0 auto;
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 10px; flex-shrink: 0;
}
.card-head h3 { font-size: 14px; font-weight: 600; color: var(--mra-foreground); }
.log-head-actions { display: flex; gap: 4px; }
.icon-btn {
  width: 28px; height: 28px; border: none; border-radius: 4px; background: transparent;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  color: var(--mra-foreground-muted); transition: all var(--mra-duration-fast) ease;
}
.icon-btn:hover { background: var(--mra-surface-hover); color: var(--mra-foreground-secondary); }
.icon-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ==== 日志区样式：复制自 style.css 364~446 ==== */
.log-area {
  flex: 1; overflow-y: auto; min-height: 0;
  background: var(--mra-surface); padding: 12px;
  font-family: var(--mra-font-sans); font-size: 12px; line-height: 1.7;
}
.log-section {
  background: var(--mra-sidebar);
  border: 1px solid var(--mra-border-light);
  border-radius: var(--mra-radius-md);
  padding: 4px 12px;
  margin-bottom: 10px;
  overflow: hidden;
}
.log-section--open { padding-bottom: 6px; }
/* step 4：展开无箭头——可点性由「内容存在」本身承载：
   首条正文落进卡体时才加 --expandable（指针光标 + 悬停底色 + 「N 条」计数胶囊），
   空卡组头不可点的视觉承诺与行为一致。
   注意：卡头同时挂 .log-line 与 .log-section-head，.log-line 的 align-items/padding
   在后声明会顶掉卡头自身规则，故卡头几何一律用 .log-section .log-section-head 提权。 */
.log-section .log-section-head {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; margin: 0 -6px;
  border-radius: var(--mra-radius-sm);
  user-select: none;
  transition: background var(--mra-duration-fast) ease;
}
.log-section--expandable .log-section-head { cursor: pointer; }
.log-section--expandable .log-section-head:hover { background: var(--mra-border-light); }
.log-section-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-left: auto; }
.log-section-meta .log-time { color: var(--mra-foreground-muted); flex-shrink: 0; }
.log-count {
  font-size: 11px; line-height: 16px; padding: 0 6px; border-radius: 8px;
  background: var(--mra-border-light); color: var(--mra-foreground-muted);
}
.log-section--expandable .log-section-head:hover .log-count,
.log-section--open .log-count { background: var(--mra-border); color: var(--mra-foreground-secondary); }

/* ==== step 1+2+4+5：卡状态槽——徽章承载「卡头风险」，词与色由状态机给出：
   组卡=生命周期终态（进行中/成功/警告/失败/未完成）；散行卡=该行自身级别
   （WARNING 警告 / ERROR 失败，Info 不发——「记录」不是级别）。
   正文行无徽章槽，级别由文字色承载（W 琥珀 / E 红）。 */
.log-status {
  flex-shrink: 0; font-size: 10px; font-weight: 600; line-height: 16px;
  padding: 0 7px; border-radius: 5px; letter-spacing: 0.5px;
}
.log-status--run  { background: color-mix(in srgb, var(--mra-info) 12%, transparent); color: var(--mra-info); animation: mra-status-pulse 1.4s ease-in-out infinite; }
.log-status--ok   { background: var(--mra-success-bg); color: var(--mra-success-strong); }
.log-status--warn { background: var(--mra-warning-bg); color: var(--mra-warning-strong); }
.log-status--err  { background: var(--mra-danger-bg); color: var(--mra-danger); }
.log-status--part { background: var(--mra-border-light); color: var(--mra-foreground-secondary); }
@keyframes mra-status-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
@media (prefers-reduced-motion: reduce) { .log-status--run { animation: none; } }

/* step 3：标题溢出处理——静止时右缘渐隐（提示还有内容，无 ellipsis 断头感），
   悬停该卡头时慢速展卷露出全文（进入 2.8s 慢滚、离开 0.4s 快收），
   滚动只在 hover 期间发生：常驻跑马灯对长驻面板是视觉噪音，且移动文字可读性差。
   prefers-reduced-motion 下不滚动，全文出口退到 title 悬停提示。 */
.log-section-head .log-msg { font-weight: 600; color: var(--mra-foreground); white-space: nowrap; overflow: hidden; }
.log-msg--more { mask-image: linear-gradient(90deg, #000 calc(100% - 16px), transparent); }
.log-msg-inner { display: inline-block; transition: transform 0.4s ease; }
.log-section-head:hover .log-msg--more {
  mask-image: linear-gradient(90deg, transparent, #000 10px, #000 calc(100% - 12px), transparent);
}
.log-section-head:hover .log-msg--more .log-msg-inner {
  transform: translateX(var(--scroll-x, 0));
  transition: transform 2.8s cubic-bezier(0.25, 0.5, 0.35, 1);
}
@media (prefers-reduced-motion: reduce) {
  .log-section-head:hover .log-msg--more .log-msg-inner { transform: none; }
}

.log-section-body {
  height: 0; overflow: hidden;
  interpolate-size: allow-keywords;
  transition: height var(--mra-duration-base) cubic-bezier(0.22, 1, 0.36, 1);
}
.log-section--open .log-section-body { height: auto; }
@media (prefers-reduced-motion: reduce) { .log-section-body { transition: none; } }
.log-line {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 2px 0 2px 10px; word-break: break-all;
  color: var(--mra-foreground-secondary);
}
.log-msg { flex: 1; min-width: 0; }
.log-time { color: var(--mra-foreground-muted); flex-shrink: 0; }
/* step 4：正文行去彩点——级别信息此前由「彩点 + 文字颜色」双份承载，删点后不丢信息。
   step 5：卡头风险由徽章承载（组卡终态），标题不按级别上色。
   step 6：级别色同时挂裸行自身（无组散行无 .log-msg 子节点）；关键词着色随 KW_RULES 退役。 */
.log-line--ERROR, .log-line--ERROR .log-msg { color: var(--mra-danger); }
.log-line--WARNING, .log-line--WARNING .log-msg { color: var(--mra-warning-strong); }
</style>
</head>
<body>
<div class="card">
  <div class="card-head">
    <h3>运行日志</h3>
    <div class="log-head-actions">
      <button class="icon-btn" id="btn-log-clear" title="清空">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>
      </button>
      <button class="icon-btn" title="复制">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      </button>
    </div>
  </div>
  <div class="log-area" id="log-area"></div>
</div>

<script>
// ==== 渲染管线 = 契约 §8 第 9 步后的终态：卡片只来自组事件，
//      无组散行=裸行（级别文字色）；一切文本经 textContent 落 DOM，无 innerHTML 注入面。 ====
function $(id) { return document.getElementById(id); }
const levelClassMap = { INFO: 'INFO', WARNING: 'WARNING', ERROR: 'ERROR' };

// 卡状态槽：词与色由状态机给出。组卡=终态；散行卡=自身级别（Info 不发「记录」）。
const STATUS = {
  run:  ['log-status--run', '进行中'], ok: ['log-status--ok', '成功'],
  warn: ['log-status--warn', '警告'],  err: ['log-status--err', '失败'],
  part: ['log-status--part', '未完成'],
};
// 徽章槽允许后发：散行卡建卡时无徽章，级别落定/升格时按需插入卡头首位。
function setPill(sec, key) {
  let pill = sec.querySelector('.log-status');
  if (!pill) {
    pill = document.createElement('span');
    sec.querySelector('.log-section-head').prepend(pill);
  }
  pill.className = 'log-status ' + STATUS[key][0];
  pill.textContent = STATUS[key][1];
}

const _openGroups = new Map(); // 开组表：group_id → { sec, worst }

function _makeSection(kind, ts, titleText, rawText, pillKey) {
  const sec = document.createElement('div');
  sec.className = 'log-section log-section--' + kind;
  const head = document.createElement('div');
  head.className = 'log-line log-section-head';
  head.dataset.raw = rawText;
  head.title = rawText;
  if (pillKey) {
    const pill = document.createElement('span');
    pill.className = 'log-status ' + STATUS[pillKey][0];
    pill.textContent = STATUS[pillKey][1];
    head.appendChild(pill);
  }
  const msg = document.createElement('span');
  msg.className = 'log-msg';
  msg.textContent = titleText;
  head.appendChild(msg);
  const meta = document.createElement('span');
  meta.className = 'log-section-meta';
  const time = document.createElement('span');
  time.className = 'log-time';
  time.textContent = ts;
  meta.appendChild(time);
  head.appendChild(meta);
  const body = document.createElement('div');
  body.className = 'log-section-body';
  sec.appendChild(head);
  sec.appendChild(body);
  $('log-area').appendChild(sec);
  bindSectionToggle(sec);
  return sec;
}
// 正文行统一入口：落进卡体的那一刻卡才获得可展开性（计数胶囊 + 指针光标 + 悬停底色）。
function addRow(sec, rowEl) {
  sec.querySelector('.log-section-body').appendChild(rowEl);
  sec.classList.add('log-section--expandable');
  const meta = sec.querySelector('.log-section-meta');
  let chip = sec.querySelector('.log-count');
  if (!chip) {
    chip = document.createElement('span');
    chip.className = 'log-count';
    meta.insertBefore(chip, meta.firstChild);
  }
  chip.textContent = String(Number(chip.textContent || 0) + 1);
}
function bindSectionToggle(sec) {
  const head = sec.querySelector('.log-section-head');
  if (!head || head.dataset.bound) return;
  head.dataset.bound = '1';
  head.addEventListener('click', (ev) => { ev.preventDefault(); sec.classList.toggle('log-section--open'); });
}
const FOLLOW_BOTTOM_PX = 24;
function isNearBottom(el) { return el.scrollHeight - el.scrollTop - el.clientHeight <= FOLLOW_BOTTOM_PX; }

// step 3：溢出检测一次性接线——超宽的卡头标题包内层卷动体并量出位移。
// dataset.fit 去重：每张卡只测一次（标题建卡后不再变化）。
function fitTitles() {
  document.querySelectorAll('.log-section-head .log-msg').forEach((el) => {
    if (el.dataset.fit) return;
    el.dataset.fit = '1';
    if (el.scrollWidth <= el.clientWidth + 1) return;
    el.classList.add('log-msg--more');
    const inner = document.createElement('span');
    inner.className = 'log-msg-inner';
    while (el.firstChild) inner.appendChild(el.firstChild);
    el.appendChild(inner);
    el.style.setProperty('--scroll-x',
      -(inner.scrollWidth - el.clientWidth + 8) + 'px');
  });
}

function _makeRow(lvl, msgText, rawText) {
  const row = document.createElement('div');
  row.className = 'log-line log-line--' + lvl;
  row.dataset.raw = rawText;
  const msg = document.createElement('span');
  msg.className = 'log-msg';
  msg.textContent = msgText;
  row.appendChild(msg);
  return row;
}

// ---- 无组散行 = 裸行（终态：不再锚点成卡；级别由整行文字色承载） ----
function appendLogs(lines) {
  const area = $('log-area');
  const followBottom = isNearBottom(area);
  lines.forEach((raw) => {
    const div = document.createElement('div');
    const m = raw.match(/^\[(\d{2}:\d{2}:\d{2})\] \[(\w+)\] /);
    div.className = 'log-line' + (m && levelClassMap[m[2]] ? ' log-line--' + m[2] : '');
    div.dataset.raw = raw;
    div.textContent = raw;
    area.appendChild(div);
  });
  if (followBottom) area.scrollTop = area.scrollHeight;
}

// ---- 结构化管线：组事件建卡/收尾，组内行进卡体，无组行落裸行 ----
function renderEvents(events, truncated) {
  const area = $('log-area');
  const followBottom = isNearBottom(area);
  if (truncated) {
    const hint = document.createElement('div');
    hint.className = 'log-line';
    hint.textContent = '[!!] 日志界面因落后过多已自动截断，以下为最新日志';
    area.appendChild(hint);
  }
  events.forEach((rec) => {
    if (rec.event_type === 'group_start') {
      const kind = (rec.kind === 'phase' || rec.kind === 'session' || rec.kind === 'loop') ? rec.kind : 'session';
      const title = rec.title || '';
      const sec = _makeSection(kind, rec.ts, title, '[' + rec.ts + '] [INFO] ' + title, 'run');
      _openGroups.set(rec.group_id, { sec, worst: null });
      return;
    }
    if (rec.event_type === 'group_end') {
      const g = _openGroups.get(rec.group_id);
      if (!g) return;
      setPill(g.sec, { success: 'ok', warning: 'warn', failure: 'err', incomplete: 'part' }[rec.outcome] || 'ok');
      _openGroups.delete(rec.group_id);
      return;
    }
    let g = rec.group_id ? _openGroups.get(rec.group_id) : null;
    if (rec.group_id && !g) {
      g = { sec: _makeSection('session', rec.ts, '…（更早的组头已截断）', '', null), worst: null };
      _openGroups.set(rec.group_id, g);
    }
    const lvl = levelClassMap[rec.level] ? rec.level : 'INFO';
    const suffix = rec.fields ? Object.keys(rec.fields).map((k) => ' · ' + k + ': ' + rec.fields[k]).join('') : '';
    const rawText = '[' + rec.ts + '] [' + rec.level + '] ' + (rec.message || '') + suffix;
    if (!g) { appendLogs([rawText]); return; }
    addRow(g.sec, _makeRow(lvl, (rec.message || '') + suffix, rawText));
    if (lvl === 'ERROR') g.worst = 'err';
    else if (lvl === 'WARNING' && g.worst !== 'err') g.worst = g.worst || 'warn';
  });
  fitTitles();
  if (followBottom) area.scrollTop = area.scrollHeight;
}

// ==== 事件流：treasure 迁移后的真实 GUI 流（组事件 + 无组散行混排）====
const ev = (seq, type, o) => Object.assign({ seq, event_type: type, schema_version: 1, level: 'INFO' }, o);
const EVENTS = [
  ev(1, 'log', { group_id: null, ts: '14:02:11', channel: 'app', message: '已连接窗口 (hWnd=196650, 巅峰极速)' }),
  ev(2, 'log', { group_id: null, ts: '14:02:12', channel: 'app', message: '断点模式: 从头开始' }),
  ev(3, 'group_start', { group_id: 'g-3', ts: '14:02:14', channel: 'treasure', kind: 'session', title: '[鉴宝] 模块启动：截图 + 记录 + 选鉴宝师自动化（其余阶段不操作）', outcome: 'running' }),
  ev(4, 'group_end', { group_id: 'g-3', ts: '14:02:14', channel: 'treasure', kind: 'session', title: '[鉴宝] 模块启动：截图 + 记录 + 选鉴宝师自动化（其余阶段不操作）', outcome: 'success', has_warning: false, has_error: false, duration_ms: 200 }),
  ev(5, 'group_start', { group_id: 'g-5', ts: '14:02:15', channel: 'treasure', kind: 'phase', title: '[鉴宝] 进入阶段: 拍品观察 [expert]', outcome: 'running' }),
  ev(6, 'log', { group_id: 'g-5', ts: '14:02:19', level: 'WARNING', channel: 'treasure', message: '[鉴宝点击] 任务槽忙，本帧跳过点击 key=stage_expert（非手柄方式：上一帧结果尚未取走）' }),
  ev(7, 'log', { group_id: 'g-5', ts: '14:02:24', level: 'WARNING', channel: 'treasure', message: '[鉴宝出价] 数字键 3 点击后 800ms 输入框读数未变化，第 1/3 次重发（疑似点击未送达，详见日志上文点击记录）' }),
  ev(8, 'group_end', { group_id: 'g-5', ts: '14:06:40', channel: 'treasure', kind: 'phase', outcome: 'warning', has_warning: true, has_error: false, duration_ms: 265000 }),
  ev(9, 'group_start', { group_id: 'g-9', ts: '14:06:40', channel: 'treasure', kind: 'loop', title: '[鉴宝循环] 完成 1 场: 状态机侧累计 4 场（上限 8，OCR侧=4，已达上限停止开新场 = False）', outcome: 'running' }),
  ev(10, 'log', { group_id: 'g-9', ts: '14:06:41', channel: 'treasure', message: '[鉴宝落盘] 已记录第 4 场: 策略=profit 结果=win 成交=51,000 利润=+7,000 收入=58,000' }),
  ev(11, 'group_end', { group_id: 'g-9', ts: '14:06:41', channel: 'treasure', kind: 'loop', outcome: 'success', has_warning: false, has_error: false, duration_ms: 1000 }),
  ev(12, 'group_start', { group_id: 'g-12', ts: '14:06:42', channel: 'treasure', kind: 'phase', title: '[鉴宝] 进入阶段: 大师场 [master]', outcome: 'running' }),
  ev(13, 'log', { group_id: 'g-12', ts: '14:06:45', level: 'WARNING', channel: 'treasure', message: '[鉴宝点击] key=master_confirm 点击后 2500ms 仍在「大师场」，第 1/3 次重试' }),
  ev(14, 'log', { group_id: 'g-12', ts: '14:06:48', level: 'WARNING', channel: 'treasure', message: '[鉴宝点击] key=master_confirm 点击后 2500ms 仍在「大师场」，第 2/3 次重试' }),
  ev(15, 'log', { group_id: 'g-12', ts: '14:06:55', channel: 'treasure', message: '[鉴宝分红] 已点击领取，等待读取本场收入' }),
  ev(16, 'log', { group_id: 'g-12', ts: '14:06:57', channel: 'treasure', message: '[鉴宝] 今日最高积分上涨至 12,400' }),
  ev(17, 'log', { group_id: null, ts: '14:06:58', level: 'WARNING', channel: 'app', message: '[鉴宝] 动作失败 node=bid_confirm_red_btn reason=识别未命中' }),
  ev(18, 'group_end', { group_id: 'g-12', ts: '14:12:03', channel: 'treasure', kind: 'phase', outcome: 'warning', has_warning: true, has_error: false, duration_ms: 321000 }),
  ev(19, 'group_start', { group_id: 'g-19', ts: '14:12:03', channel: 'treasure', kind: 'loop', title: '鉴宝观察会话总结', outcome: 'running' }),
  ev(20, 'log', { group_id: 'g-19', ts: '14:12:03', channel: 'treasure', message: '[鉴宝落盘] 本场结算：收入 58,000 / 利润 +7,000（成交价 51,000 / 估值 55,000）' }),
  ev(21, 'log', { group_id: 'g-19', ts: '14:12:03', channel: 'treasure', message: '[鉴宝] 今日最高积分：12,400' }),
  ev(22, 'group_end', { group_id: 'g-19', ts: '14:12:03', channel: 'treasure', kind: 'loop', outcome: 'success', has_warning: false, has_error: false, duration_ms: 300 }),
  ev(23, 'group_start', { group_id: 'g-23', ts: '14:12:04', channel: 'treasure', kind: 'loop', title: '[鉴宝循环] 已到每日循环上限 8 场，本场为最后一场，回鉴宝大厅确认后进入彩蛋任务收尾并自动停止。', outcome: 'running' }),
  ev(24, 'log', { group_id: 'g-23', ts: '14:12:05', channel: 'treasure', message: '[彩蛋收尾] 开始领取彩蛋任务' }),
];
// 活体尾巴：持续写入最后一个组
const TAIL = [
  { level: 'INFO', message: '[鉴宝落盘] 领取数已累加(2026-09-21): 红+2 黄+1 蓝+0 银币+250,000 积分+30,000' },
  { level: 'INFO', message: '[彩蛋收尾] 收尾完成，请求停止模块' },
];
let idx = 0, tick = 0;
function pump() {
  if (idx < EVENTS.length) { renderEvents([EVENTS[idx]], false); idx++; setTimeout(pump, 500); return; }
  if (tick >= TAIL.length) return; // 活体尾巴写完即止（g-23 收尾后不得再往里写）
  const t = TAIL[tick];
  const sec = 10 + tick * 4;
  renderEvents([ev(100 + tick, 'log', Object.assign({ group_id: 'g-23', ts: '14:12:' + String(sec).padStart(2, '0'), channel: 'treasure' }, t))], false);
  if (tick === TAIL.length - 1) {
    renderEvents([ev(199, 'group_end', { group_id: 'g-23', ts: '14:12:55', channel: 'treasure', kind: 'loop', outcome: 'success', has_warning: false, has_error: false, duration_ms: 51000 })], false);
  }
  tick++;
  setTimeout(pump, 2600);
}
pump();
$('btn-log-clear').addEventListener('click', () => {
  $('log-area').innerHTML = ''; _openGroups.clear();
});
