<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>员工守则试验区 v2 · egg_lab</title>
<style>
  :root {
    --mra-primary: #E5484D; --mra-primary-hover: #F05A5F; --mra-primary-foreground: #FFFFFF;
    --mra-background: #F5F6FA; --mra-surface: #FFFFFF; --mra-sidebar: #FAFBFD;
    --mra-foreground: #1F2328; --mra-foreground-secondary: #4A5160; --mra-foreground-muted: #8B93A7;
    --mra-border: #E5E7EB; --mra-border-light: #EEF0F4; --mra-border-strong: #D1D5DB;
    --mra-success: #10B981; --mra-danger: #EF4444;
    --mra-radius-md: 8px; --mra-radius-lg: 10px; --mra-radius-xl: 12px;
    --mra-font-sans: "Noto Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    --mra-font-mono: Consolas, monospace;
    --mra-duration-fast: .15s; --mra-duration-base: .2s;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; padding-bottom: 80px; background: var(--mra-background);
         color: var(--mra-foreground); font-family: var(--mra-font-sans); font-size: 13px; line-height: 1.6; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { color: var(--mra-foreground-muted); font-size: 12px; margin: 0 0 14px; }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .bar button { cursor: pointer; border: 1px solid var(--mra-border); background: var(--mra-surface);
    border-radius: var(--mra-radius-md); padding: 7px 14px; font-family: var(--mra-font-sans);
    font-size: 12px; color: var(--mra-foreground); }
  .bar button:hover { border-color: var(--mra-foreground-muted); }
  .vchip { font-family: var(--mra-font-mono); font-size: 12px; color: var(--mra-foreground-muted);
    background: var(--mra-surface); border: 1px dashed var(--mra-border); border-radius: 6px;
    padding: 4px 10px; cursor: pointer; user-select: none; }
  #selftest { background: var(--mra-surface); border: 1px solid var(--mra-border);
    border-radius: var(--mra-radius-lg); padding: 12px 16px; margin-top: 16px;
    font-family: var(--mra-font-mono); font-size: 12px; white-space: pre-wrap; }
  #selftest .ok { color: var(--mra-success); } #selftest .bad { color: var(--mra-danger); }

  /* ===== 以下照抄生产 style.css ===== */
  .falling-text {
    position: fixed; left: 0; top: 0; z-index: 9999;
    pointer-events: none; user-select: none;
    font-family: var(--mra-font-mono); font-size: 16px; font-weight: 700;
    color: var(--mra-primary);
    text-shadow: 0 2px 10px color-mix(in srgb, var(--mra-primary) 35%, transparent);
    will-change: transform, opacity; transition: opacity 0.5s ease;
  }
  .mra-modal-overlay {
    position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center;
    animation: modal-overlay-in var(--mra-duration-fast) ease-out both;
  }
  .mra-modal-overlay--closing { animation: modal-overlay-out var(--mra-duration-fast) ease-in both; }
  .mra-modal-card { background: var(--mra-surface); border: 1px solid var(--mra-border);
    border-radius: var(--mra-radius-xl); padding: 22px 24px;
    max-width: var(--mra-modal-max-width, 420px); width: 92%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    display: flex; flex-direction: column; max-height: 86vh; }
  @keyframes modal-overlay-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modal-overlay-out { from { opacity: 1; } to { opacity: 0; } }
  .mra-modal-title { margin: 0 0 10px; font-size: 15px; flex-shrink: 0; color: var(--mra-foreground); }
  .mra-modal-body { overflow-y: auto; min-height: 0; word-break: break-word; }
  .mra-modal-actions { display: flex; gap: 10px; justify-content: flex-end; align-items: center;
    margin-top: 14px; flex-shrink: 0; }
  .mra-modal-btn { cursor: pointer; border-radius: var(--mra-radius-md); font-size: 13px; padding: 8px 16px;
    border: 1px solid var(--mra-border); background: transparent;
    color: var(--mra-foreground-secondary); font-family: var(--mra-font-sans); }
  .mra-modal-btn--primary { border: none; background: var(--mra-primary); color: var(--mra-primary-foreground); }
  .mra-modal-rules { display: flex; gap: 14px; align-items: flex-start; }
  .mra-modal-rules-icon { width: 40px; height: 40px; flex-shrink: 0; margin-top: 4px; }
  .mra-modal-rules-list { flex: 1; min-width: 0; max-height: 56vh; overflow-y: auto; padding-right: 4px;
    scrollbar-width: none; }
  .mra-modal-rules-list::-webkit-scrollbar { display: none; }
  .mra-modal-rule { display: flex; gap: 10px; margin: 0 0 10px;
    font-size: 13px; line-height: 1.7; color: var(--mra-foreground); }
  .mra-modal-rule-num { flex-shrink: 0; color: var(--mra-primary); }
  .mra-modal-rule { opacity: 0; transform: translateY(5px); animation: mra-rule-in 0.5s ease forwards; }
  @keyframes mra-rule-in { to { opacity: 1; transform: none; } }
  .mra-modal-rule--ghost { color: var(--mra-foreground-muted); }
  .mra-modal-rule--ghost .mra-modal-rule-num { color: var(--mra-foreground-muted); }
  .mra-modal-rule--ghost .mra-modal-rule-secret { opacity: 0; transition: opacity var(--mra-duration-base) ease; }
  .mra-modal-rule--ghost.revealed .mra-modal-rule-secret { opacity: 1; }
  .mra-modal-title--egg { animation: mra-egg-breathe 6s ease-in-out infinite; }
  @keyframes mra-egg-breathe { 0%, 100% { letter-spacing: 2px; } 50% { letter-spacing: 3.4px; } }
  .mra-modal-btn--egg { will-change: transform; }
  .falling-text--egg { color: var(--mra-danger); border-color: transparent; }
  .mra-dot-blink { animation: mra-dot-blink 0.3s ease 2; }
  @keyframes mra-dot-blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .mra-modal-rule { animation: none; opacity: 1; transform: none; }
    .mra-modal-title--egg { animation: none; }
  }
  .statusbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--mra-surface);
    border-top: 1px solid var(--mra-border-light); padding: 8px 24px; display: flex;
    align-items: center; gap: 8px; font-size: 12px; color: var(--mra-foreground-muted); z-index: 10000; }
  .mra-status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mra-success); }
</style>
</head>
<body>
<h1>员工守则试验区 v2</h1>
<p class="sub">躲避场升级为整张弹层卡（二维逃跑、能扑到正文上），位移上限 110px、硬钳制在卡内 12px——逃得起来，也跑不丢。手动抓按钮玩手感，点「跑自检」看断言。</p>
<div class="bar">
  <button id="btn-open">打开守则</button>
  <span class="vchip" id="about-version">v0.23.0.dev1+252</span>
  <span style="font-size:11px;color:var(--mra-foreground-muted);">（连点 10 次开守则，掉落 1/5 混怪谈短语）</span>
  <button id="btn-test">跑自检</button>
</div>
<div id="selftest">自检输出区（点「跑自检」）</div>
<div class="statusbar"><span class="mra-status-dot" id="status-dot"></span><span id="status-text">系统就绪</span></div>

<script>
(function () {
  'use strict';
  var out = document.getElementById('selftest');
  function log(msg, cls) {
    var s = document.createElement('span');
    if (cls) s.className = cls;
    s.textContent = msg + '\n';
    out.appendChild(s);
  }
  function clearLog() { out.textContent = ''; }
  var $ = function (id) { return document.getElementById(id); };

  // ================= 与生产 app.js 6a048c2 同构（wireEggDodge 为 v2 版） =================
  const FALLING_EGG_TEXTS = ['3:33', '不要清点', '它记得你'];
  const FALLING_EGG_EVERY = 5;
  const MAX_FALLING = 40;
  let eggFallCount = 0;

  // 员工守则（规则怪谈，致敬 MAA）。结构：池中每次抽 EGG_RULE_SAMPLE 条（编号 1-8，随机）
  // + 第 9 条固定（修订声明，给抽样一个"官方解释"）+ 第 10 条（数字乱码 + 悬停显影）。
  // 条目锚点全部是 GUI 真实存在的元素（静音恢复/日志轮转/状态栏绿点/自动关机/数据页看板）；
  // 口味：执行体口吻不许笑、暗示事件不解释、数字母题（清点/数错）贯穿首尾。
  const EGG_RULE_META = '本守则会不定期修订。你读到的版本，就是你需要读的版本。';
  const EGG_RULES_POOL = [
    '正式版没有「调试模式」。如果你在任何页面看到它，不要点击，也不要截图。开发者会知道你来过。',
    '运行前请断开所有物理手柄。如果你确定已经断开，界面却显示「已连接」，请相信你的手，不要相信界面。',
    '运行期间游戏会被静音，结束后自动恢复。如果音量没有回来，先别动音量键——想一想，刚才那一场，是不是你没有开始过的。',
    '日志按会话分目录，只保留最近若干份。如果某个目录的修改时间早于你安装软件的时间，不要打开它。里面没有你会想看的东西。',
    '左下角的绿点表示系统就绪。它应该一直是静止的。如果你看到它闪了两下，那不是故障，是确认。',
    '从关于页掉落的版本号是正常的。如果它们开始排队，请不要清点数量。',
    '任务结束后它会关闭模拟器。它只会关闭模拟器。到目前为止，它只关闭模拟器。',
    '「停止」按钮随时有效。如果它在你按下之前就已经变灰，说明有人替你停止了这一场。不要去查是谁。',
    '软件不会在你睡觉时更新自己。如果你早上发现版本号变了，那不是更新。',
    '数据页会如实记录今天的每一场。如果数字对不上，多出来的那一场，不算你的。',
    '版本号由版本控制自动推导，任何人不得手改。如果你在关于页看到自己的名字，而你从没参与开发——这一版是专门为你编译的。',
    '软件没有语音。如果你听到低语，先听清它在说什么。多数时候，它只是在重复你自己说过的话。'
  ];
  const EGG_RULE_LAST = '最后一条规则不存在。如果你已经数到了它，说明你数错了。这很正常。';
  const EGG_RULE_SAMPLE = 8;

  function blinkStatusDot() {
    const dot = $('status-dot');
    if (!dot) return;
    dot.classList.remove('mra-dot-blink');
    void dot.offsetWidth;
    dot.classList.add('mra-dot-blink');
  }

  // [lab-iter2] 躲避场 = 整张弹层卡，二维逃跑：
  //   位移 = 背离光标方向 × 强度（随距离平方衰减）× reach，钳制在卡内 inset；
  //   光标退开 radius 外 → 弹簧回布局位。感知基准 = 按钮视觉中心（你的手接近它）。
  const EGG_DODGE = { radius: 120, reach: 140, falloff: 2, inset: 12 };
  // [lab-iter4] 抓到一次亮一句；末句亮起后放弃躲避，再抓一次才放你走
  const EGG_CATCH_LINES = ['抓不到', '差一点', '太慢了', '别追了', '你为什么执意要走', '好吧。你走吧。'];
  function wireEggDodge(modal, chase) {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return null;
    if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return null;
    const field = modal.card;
    const btn = field.querySelector('.mra-modal-btn');
    if (!field || !btn) return null;
    btn.classList.add('mra-modal-btn--egg');
    btn.style.minWidth = btn.offsetWidth + 'px'; // 换字不抖行
    let raf = 0, pointer = null;
    let curX = 0, curY = 0; // 当前位移，用于从视觉矩形反推布局位
    const setT = (tx, ty, fleeing) => {
      btn.style.transition = 'transform ' + (fleeing ? '.13s' : '.62s') + ' cubic-bezier('
        + (fleeing ? '0.23, 1, 0.32, 1' : '0.34, 1.56, 0.64, 1') + ')';
      btn.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';
      curX = tx; curY = ty;
    };
    function frame() {
      raf = 0;
      if (!document.body.contains(btn)) return;
      const cardR = field.getBoundingClientRect();
      const btnR = btn.getBoundingClientRect();
      const layoutL = btnR.left - curX, layoutT = btnR.top - curY;
      const cx = btnR.left + btnR.width / 2, cy = btnR.top + btnR.height / 2;
      const d = pointer ? Math.hypot(pointer.x - cx, pointer.y - cy) : Infinity;
      let tx = 0, ty = 0, fleeing = false;
      if (!chase.gave && pointer && Number.isFinite(d) && d > 0) {
        const flee = d < EGG_DODGE.radius ? Math.pow(1 - d / EGG_DODGE.radius, EGG_DODGE.falloff) : 0;
        if (flee > 0) {
          const dx = pointer.x - cx, dy = pointer.y - cy;
          const dd = Math.hypot(dx, dy) || 1;
          tx = -(dx / dd) * flee * EGG_DODGE.reach;
          ty = -(dy / dd) * flee * EGG_DODGE.reach;
          fleeing = true;
        }
      }
      // 出界钳制 + 撞墙滑移 [lab-iter3]：被夹掉的分量沿自由轴重分配——
      // 角落不再困死按钮，贴着墙继续溜（更自由）；硬边界仍是卡内 inset
      const minX = cardR.left + EGG_DODGE.inset - layoutL;
      const maxX = cardR.right - EGG_DODGE.inset - btnR.width - layoutL;
      const minY = cardR.top + EGG_DODGE.inset - layoutT;
      const maxY = cardR.bottom - EGG_DODGE.inset - btnR.height - layoutT;
      const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), Math.max(lo, hi));
      const desiredX = tx, desiredY = ty;
      tx = clamp(desiredX, minX, maxX);
      ty = clamp(desiredY, minY, maxY);
      const lostX = Math.abs(desiredX - tx);
      const lostY = Math.abs(desiredY - ty);
      if (lostY > 0.5) tx = clamp(tx + Math.sign(desiredX || 1) * lostY, minX, maxX);
      if (lostX > 0.5) ty = clamp(ty + Math.sign(desiredY || 1) * lostX, minY, maxY);
      setT(tx, ty, fleeing);
    }
    // 抓到 = 亮下一句；末句亮起后不再躲避（gave），再抓一次才关门
    btn.addEventListener('click', () => {
      chase.catches++;
      const idx = chase.catches - 1;
      if (idx < EGG_CATCH_LINES.length) {
        btn.textContent = EGG_CATCH_LINES[idx];
        if (idx === EGG_CATCH_LINES.length - 1) chase.gave = true;
        return;
      }
      modal.close();
    });
    const onMove = (e) => { pointer = { x: e.clientX, y: e.clientY }; if (!raf) raf = requestAnimationFrame(frame); };
    const onLeave = () => { pointer = null; if (!raf) raf = requestAnimationFrame(frame); };
    window.addEventListener('pointermove', onMove, { passive: true });
    document.addEventListener('pointerleave', onLeave);
    window.addEventListener('blur', onLeave);
    return () => {
      window.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerleave', onLeave);
      window.removeEventListener('blur', onLeave);
      if (raf) cancelAnimationFrame(raf);
    };
  }

  // [lab-iter5] 第 10 条数字乱码：字符集内随机翻动，自左向右逐位落定为「10.」（DecryptedText 手法自实现）
  function scrambleNumber(el, finalText) {
    const glyphs = '01<>#$%&@?!/\\_-';
    let frame = 0;
    const total = 20; // 40ms × 20 ≈ 0.8s
    const timer = setInterval(() => {
      if (!document.body.contains(el)) { clearInterval(timer); return; }
      frame++;
      const settled = Math.floor((frame / total) * finalText.length);
      let s = finalText.slice(0, settled);
      for (let i = settled; i < finalText.length; i++) {
        s += glyphs[Math.floor(Math.random() * glyphs.length)];
      }
      el.textContent = s;
      if (frame >= total) { el.textContent = finalText; clearInterval(timer); }
    }, 40);
  }

  function showRulesDialog() {
    const pool = EGG_RULES_POOL.slice();
    const picked = [];
    while (picked.length < EGG_RULE_SAMPLE && pool.length) {
      picked.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    }
    const rows = [];
    picked.forEach((r, i) => {
      rows.push('<p class="mra-modal-rule" style="animation-delay:' + (i * 100) + 'ms">'
        + '<b class="mra-modal-rule-num">' + (i + 1) + '.</b><span>' + r + '</span></p>');
    });
    rows.push('<p class="mra-modal-rule" style="animation-delay:' + (picked.length * 100) + 'ms">'
      + '<b class="mra-modal-rule-num">9.</b><span>' + EGG_RULE_META + '</span></p>');
    rows.push('<p class="mra-modal-rule mra-modal-rule--ghost" style="animation-delay:'
      + (picked.length * 100 + 150) + 'ms"><b class="mra-modal-rule-num" data-final="10.">10.</b>'
      + '<span class="mra-modal-rule-secret">' + EGG_RULE_LAST + '</span></p>');
    const chase = { catches: 0, gave: false };
    let cleanupDodge = null;
    const modal = openModal({
      title: '员工守则',
      maxWidth: 580,
      bodyHtml:
        '<div class="mra-modal-rules">' +
        '<img class="mra-modal-rules-icon" alt="">' +
        '<div class="mra-modal-rules-list">' + rows.join('') + '</div>' +
        '</div>',
      closeOnOverlay: false, // 不给逃课出口：点空白不关（Esc 仍可）
      onClose: () => {
        blinkStatusDot();
        if (cleanupDodge) cleanupDodge();
      },
      buttons: [
        { text: '确定要退出吗？', primary: true },
      ],
    });
    const title = modal.card.querySelector('.mra-modal-title');
    if (title) title.classList.add('mra-modal-title--egg');
    // 第 10 条：悬停显影（JS 挂 enter/leave，可测）+ 数字乱码在渐现延迟后起播
    const ghost = modal.card.querySelector('.mra-modal-rule--ghost');
    if (ghost) {
      ghost.addEventListener('mouseenter', () => ghost.classList.add('revealed'));
      ghost.addEventListener('mouseleave', () => ghost.classList.remove('revealed'));
      setTimeout(() => scrambleNumber(ghost.querySelector('.mra-modal-rule-num'), '10.'),
        picked.length * 100 + 150);
    }
    cleanupDodge = wireEggDodge(modal, chase);
    return modal;
  }

  function spawnFallingText(text, cx, cy, isEgg) {
    const alive = document.querySelectorAll('.falling-text');
    if (alive.length >= MAX_FALLING) alive[0].remove();
    const el = document.createElement('div');
    el.className = 'falling-text' + (isEgg ? ' falling-text--egg' : '');
    el.textContent = text;
    document.body.appendChild(el);
    const w = el.offsetWidth;
    const h = el.offsetHeight;
    let x = cx - w / 2;
    let y = cy - h / 2;
    let vx = (Math.random() - 0.5) * 240;
    let vy = -80 - Math.random() * 100;
    let rot = 0;
    let vr = (Math.random() - 0.5) * 160;
    let bounces = 0;
    let gone = false;
    let last = performance.now();
    function step(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      vy += 1800 * dt;
      x += vx * dt;
      y += vy * dt;
      rot += vr * dt;
      const floor = window.innerHeight - h - 60;
      if (y > floor) {
        y = floor;
        vy = -vy * 0.42;
        vx *= 0.72;
        vr *= 0.5;
        if (++bounces > 3 || Math.abs(vy) < 60) gone = true;
      }
      el.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + rot + 'deg)';
      if (gone) {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 500);
        return;
      }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function openModal(opts) {
    const overlay = document.createElement('div');
    overlay.className = 'mra-modal-overlay';
    const card = document.createElement('div');
    card.className = 'mra-modal-card';
    card.style.setProperty('--mra-modal-max-width', (opts.maxWidth || 420) + 'px');
    const h3 = document.createElement('h3');
    h3.className = 'mra-modal-title';
    h3.textContent = opts.title || '';
    card.appendChild(h3);
    const body = document.createElement('div');
    body.className = 'mra-modal-body';
    body.innerHTML = opts.bodyHtml || '';
    card.appendChild(body);
    const modal = { overlay, card, close };
    function close() {
      if (overlay._closing) return;
      overlay._closing = true;
      if (typeof opts.onClose === 'function') opts.onClose();
      overlay.classList.add('mra-modal-overlay--closing');
      setTimeout(() => overlay.remove(), 160);
    }
    if (Array.isArray(opts.buttons) && opts.buttons.length) {
      const row = document.createElement('div');
      row.className = 'mra-modal-actions';
      opts.buttons.forEach((b) => {
        const el = document.createElement('button');
        el.className = 'mra-modal-btn' + (b.primary ? ' mra-modal-btn--primary' : '');
        el.textContent = b.text;
        if (b.onClick) el.addEventListener('click', () => b.onClick(modal));
        row.appendChild(el);
      });
      card.appendChild(row);
    }
    overlay.appendChild(card);
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (ev) => {
      // closeOnOverlay: false = 点空白不关（守则弹层堵逃课出口用）；默认 true
      if (ev.target === overlay && opts.closeOnOverlay !== false) modal.close();
    });
    return modal;
  }

  function mixFall(eggFallCount) {
    const eggHit = Array.isArray(FALLING_EGG_TEXTS) && FALLING_EGG_TEXTS.length
      && eggFallCount % FALLING_EGG_EVERY === 0;
    return {
      text: eggHit
        ? FALLING_EGG_TEXTS[Math.floor(Math.random() * FALLING_EGG_TEXTS.length)]
        : 'v0.23.0.dev1+252',
      isEgg: eggHit
    };
  }

  let eggClickCount = 0, eggLastClickAt = 0;
  const EGG_DIALOG_CLICKS = 10;
  $('about-version').addEventListener('click', (e) => {
    const now = Date.now();
    eggClickCount = now - eggLastClickAt < 2000 ? eggClickCount + 1 : 1;
    eggLastClickAt = now;
    if (eggClickCount >= EGG_DIALOG_CLICKS) {
      eggClickCount = 0;
      showRulesDialog();
    }
    eggFallCount++;
    const f = mixFall(eggFallCount);
    spawnFallingText(f.text, e.clientX, e.clientY, f.isEgg);
  });
  $('btn-open').addEventListener('click', () => showRulesDialog());

  // ================= 自检 =================
  const raf2 = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  async function runSelfTest() {
    clearLog();
    const ok = (m) => log('✓ ' + m, 'ok');
    const bad = (m) => log('✗ ' + m, 'bad');
    {
      const pool = EGG_RULES_POOL.slice();
      const picked = [];
      while (picked.length < EGG_RULE_SAMPLE && pool.length) {
        picked.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
      }
      (picked.length === EGG_RULE_SAMPLE
        && new Set(picked).size === EGG_RULE_SAMPLE
        && picked.every((r) => EGG_RULES_POOL.includes(r)))
        ? ok('抽样：8 条、不重复、出自池')
        : bad('抽样形状异常');
    }
    {
      let eggs = 0;
      for (let i = 1; i <= 25; i++) if (mixFall(i).isEgg) eggs++;
      (eggs === 5) ? ok('掉落混入：25 点 5 中') : bad('掉落混入频率异常：' + eggs);
    }
    // 躲避：二维自由度 + 出界钳制 + 跑距上限
    const modal = showRulesDialog();
    const btn = modal.card.querySelector('.mra-modal-btn');
    // 结构：10 行 = 抽 8 + 固定 9 + 幽灵 10
    const rowsAll = modal.card.querySelectorAll('.mra-modal-rule');
    (rowsAll.length === 10
      && rowsAll[8].textContent.indexOf('本守则会不定期修订') !== -1
      && rowsAll[8].querySelector('.mra-modal-rule-num').textContent === '9.')
      ? ok('编号结构：1-8 随机 + 第 9 条修订声明常态化')
      : bad('编号结构异常：rows=' + rowsAll.length);
    const ghost = modal.card.querySelector('.mra-modal-rule--ghost');
    const noReveal0 = !ghost.classList.contains('revealed');
    ghost.dispatchEvent(new MouseEvent('mouseenter'));
    const revealedNow = ghost.classList.contains('revealed');
    ghost.dispatchEvent(new MouseEvent('mouseleave'));
    const hiddenAgain = !ghost.classList.contains('revealed');
    (noReveal0 && revealedNow && hiddenAgain)
      ? ok('第 10 条：悬停显影 / 移出复隐')
      : bad('第 10 条悬停显影异常');
    await new Promise((r) => setTimeout(r, 2200)); // 等乱码落定（起播 ~0.95s + 翻动 0.8s）
    (ghost.querySelector('.mra-modal-rule-num').textContent === '10.')
      ? ok('乱码数字落定：10.')
      : bad('乱码未落定：' + ghost.querySelector('.mra-modal-rule-num').textContent);
    const cardR = () => modal.card.getBoundingClientRect();
    const pointerAt = async (x, y) => {
      window.dispatchEvent(new PointerEvent('pointermove', { clientX: x, clientY: y, pointerType: 'mouse' }));
      await raf2();
    };
    const btnCenter = () => {
      const br = btn.getBoundingClientRect();
      return { x: br.left + br.width / 2, y: br.top + br.height / 2 };
    };
    let c = btnCenter();
    await pointerAt(c.x, c.y); // 手按在按钮上：必须逃起来（位移非零）
    let tr = /translate\((-?[\d.]+)px, ?(-?[\d.]+)px\)/.exec(btn.style.transform);
    (tr && (Math.abs(parseFloat(tr[1])) > 0 || Math.abs(parseFloat(tr[2])) > 0))
      ? ok('接近触发二维逃离：translate(' + tr[1] + ', ' + tr[2] + ')')
      : bad('接近未触发逃离：' + btn.style.transform);
    // 出界 + 跑距扫掠：指针绕按钮一圈交替远近
    let overflow = 0, overreach = 0;
    const homeL = btn.offsetLeft, homeT = btn.offsetTop;
    for (let a = 0; a < 360; a += 15) {
      const rad = a * Math.PI / 180;
      let cc = btnCenter();
      await pointerAt(cc.x + Math.cos(rad) * (EGG_DODGE.radius + 60), cc.y + Math.sin(rad) * (EGG_DODGE.radius + 60));
      cc = btnCenter();
      await pointerAt(cc.x + Math.cos(rad) * 20, cc.y + Math.sin(rad) * 20);
      tr = /translate\((-?[\d.]+)px, ?(-?[\d.]+)px\)/.exec(btn.style.transform);
      const tx = tr ? parseFloat(tr[1]) : 0, ty = tr ? parseFloat(tr[2]) : 0;
      const br = btn.getBoundingClientRect(), cr = cardR();
      if (br.left < cr.left + EGG_DODGE.inset - 0.5 || br.right > cr.right - EGG_DODGE.inset + 0.5
        || br.top < cr.top + EGG_DODGE.inset - 0.5 || br.bottom > cr.bottom - EGG_DODGE.inset + 0.5) overflow++;
      if (Math.abs(tx) > EGG_DODGE.reach + 0.5 || Math.abs(ty) > EGG_DODGE.reach + 0.5) overreach++;
    }
    (overflow === 0) ? ok('出界扫掠：36 位置视觉矩形全部收在卡内 inset')
      : bad('出界 ' + overflow + ' 次');
    (overreach === 0) ? ok('跑距断言：位移全部 ≤ reach(' + EGG_DODGE.reach + 'px)')
      : bad('超距 ' + overreach + ' 次');
    void homeL; void homeT;
    // 抓捕序列：逐句亮起，末句后放弃躲避
    for (let i = 0; i < EGG_CATCH_LINES.length; i++) {
      btn.click();
      await raf2();
    }
    (btn.textContent === EGG_CATCH_LINES[EGG_CATCH_LINES.length - 1])
      ? ok('抓捕序列：末句已亮（' + btn.textContent + '）')
      : bad('抓捕序列异常：' + btn.textContent);
    let cc = btnCenter();
    await pointerAt(cc.x, cc.y);
    (btn.style.transform === 'translate(0px, 0px)')
      ? ok('末句后放弃躲避：手按在按钮上也不再逃')
      : bad('末句后仍在逃：' + btn.style.transform);
    // 点空白不关（逃课出口已堵）
    modal.overlay.dispatchEvent(new MouseEvent('click'));
    await raf2();
    (document.body.contains(btn)) ? ok('点空白不关：逃课出口已堵') : bad('点空白仍会关');
    // 通用弹层回归：默认仍可点空白关
    let closed2 = 0;
    const m2 = openModal({ title: 't', onClose: () => closed2++, buttons: [{ text: 'x', primary: true }] });
    m2.overlay.dispatchEvent(new MouseEvent('click'));
    await raf2();
    (!document.body.contains(m2.card)) ? ok('通用弹层：点空白默认仍可关') : bad('通用弹层被误堵');
    // onClose 单次（重复 close 走 _closing 守卫）
    let closed3 = 0;
    const m3 = openModal({ title: 't', onClose: () => closed3++ });
    m3.close(); m3.close();
    (closed3 === 1) ? ok('onClose：多次 close 只触发一次') : bad('onClose 触发 ' + closed3 + ' 次');
    // 末句后再抓一次：关门 + 绿点回响
    btn.click();
    await raf2();
    (!document.body.contains(btn)) ? ok('末句后再抓一次：关门') : bad('末句后点击未关门');
    (document.getElementById('status-dot').classList.contains('mra-dot-blink'))
      ? ok('关闭回响：绿点闪烁类已挂')
      : bad('关闭回响缺失');
    await raf2();
    log('—— 自检结束 ——');
  }
  $('btn-test').addEventListener('click', () => { runSelfTest().catch((e) => bad('自检异常: ' + e.message)); });
})();
</script>
</body>
</html>
