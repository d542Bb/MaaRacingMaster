<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>HUD ROI Tuner — 极速狂飙 HUD 区域调整</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Segoe UI", sans-serif; background: #1e1e22; color: #ddd; overflow: hidden; }
  .app { display: flex; height: 100vh; }
  .sidebar { width: 330px; background: #2a2a30; border-right: 1px solid #3a3a40; display: flex; flex-direction: column; overflow-y: auto; }
  .sidebar h2 { margin: 12px 14px 6px; font-size: 13px; color: #9cdcfe; text-transform: uppercase; letter-spacing: 1px; }
  .sidebar h2 span { color: #777; font-weight: normal; text-transform: none; letter-spacing: 0; font-size: 11px; }
  .hint { margin: 0 14px 8px; font-size: 11.5px; color: #888; line-height: 1.55; }
  .btn { display: block; width: calc(100% - 28px); margin: 4px 14px; padding: 7px 10px; background: #3a6ea5; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12.5px; }
  .btn:hover { background: #4a7eb5; }
  .btn.secondary { background: #444; } .btn.secondary:hover { background: #555; }
  .btn:disabled { background: #444; color: #777; cursor: not-allowed; }
  .btn-row { display: flex; gap: 6px; margin: 4px 14px; }
  .btn-row .btn { width: auto; flex: 1; margin: 0; }
  select { width: calc(100% - 28px); margin: 3px 14px; padding: 5px; background: #1e1e22; color: #ddd; border: 1px solid #3a3a40; border-radius: 4px; font-size: 12px; }

  .sample { margin: 3px 12px; padding: 6px 8px; background: #26262c; border: 1px solid #35353c; border-radius: 4px; cursor: pointer; }
  .sample:hover { border-color: #3a6ea5; }
  .sample.active { border-color: #3a6ea5; background: #2d3a4a; }
  .sample .t { font-size: 12px; color: #ddd; }
  .sample .why { font-size: 10.5px; color: #888; margin-top: 2px; line-height: 1.4; }

  .region-list { margin: 4px 12px 12px; }
  .region-item { padding: 5px 7px; margin-bottom: 4px; background: #26262c; border: 1px solid #35353c; border-radius: 4px; cursor: pointer; }
  .region-item:hover { border-color: #4a4a52; }
  .region-item.selected { border-color: #3a6ea5; background: #2d3a4a; }
  .region-item .row1 { display: flex; align-items: center; gap: 6px; }
  .color-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .region-item .nm { flex: 1; font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
  .region-item .px { font-size: 10px; color: #777; font-family: ui-monospace, Consolas, monospace; }
  .region-item .stat { font-size: 10px; color: #8c8; font-family: ui-monospace, Consolas, monospace; margin-top: 2px; }
  .region-item .stat.bad { color: #e08a5a; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 6px; }
  .fields label { font-size: 10.5px; color: #888; display: flex; align-items: center; gap: 4px; }
  .fields input { width: 100%; background: #1a1a1e; color: #9cdcfe; border: 1px solid #3a3a40; border-radius: 3px; padding: 3px 4px; font-size: 11px; font-family: ui-monospace, Consolas, monospace; }
  .sem { margin: 4px 14px 10px; font-size: 11px; color: #999; line-height: 1.6; background: #232329; border: 1px solid #33333a; border-radius: 4px; padding: 7px 9px; }
  .sem b { color: #9cdcfe; font-family: ui-monospace, Consolas, monospace; font-weight: normal; }
  .readout { margin: 4px 14px 12px; font-size: 11.5px; line-height: 1.5; }
  .readout .txt { font-family: ui-monospace, Consolas, monospace; color: #ce9178; word-break: break-all; }
  .readout img { max-width: 100%; margin-top: 6px; border: 1px solid #3a3a40; image-rendering: pixelated; background: #111; }
  textarea { width: calc(100% - 28px); margin: 4px 14px; height: 120px; background: #1a1a1e; color: #ce9178; border: 1px solid #3a3a40; border-radius: 4px; font-size: 11px; font-family: ui-monospace, Consolas, monospace; padding: 6px; }

  .main { flex: 1; display: flex; flex-direction: column; position: relative; }
  .toolbar { padding: 7px 14px; background: #2a2a30; border-bottom: 1px solid #3a3a40; font-size: 11.5px; color: #888; display: flex; gap: 14px; flex-wrap: wrap; }
  .toolbar b { color: #ddd; font-weight: normal; }
  .canvas-wrap { flex: 1; position: relative; overflow: hidden; background: #141417; }
  .img-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; cursor: crosshair; }
  .img-stage img { max-width: 100%; max-height: 100%; user-select: none; -webkit-user-drag: none; pointer-events: none; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  .overlay { position: absolute; inset: 0; pointer-events: none; }
  .overlay .region-box { position: absolute; pointer-events: auto; border: 2px solid; background: rgba(0,0,0,0.12); cursor: move; }
  .overlay .region-box.selected { box-shadow: 0 0 0 1px #fff inset; }
  .overlay .region-box .label { position: absolute; top: -19px; left: -2px; padding: 1px 5px; font-size: 10.5px; background: inherit; color: #fff; white-space: nowrap; border-radius: 2px 2px 0 0; font-weight: bold; }
  .overlay .region-box .handle { position: absolute; width: 9px; height: 9px; background: #fff; border: 1px solid #333; border-radius: 2px; }
  .overlay .region-box .handle.se-n { right: -5px; bottom: -5px; cursor: se-resize; }
  .overlay .region-box .handle.ne-n { right: -5px; top: -5px; cursor: ne-resize; }
  .overlay .region-box .handle.sw-n { left: -5px; bottom: -5px; cursor: sw-resize; }
  .overlay .region-box .handle.nw-n { left: -5px; top: -5px; cursor: nw-resize; }
  .overlay .creating-box { position: absolute; border: 2px dashed #ffcc00; background: rgba(255,204,0,0.1); pointer-events: none; }
  .drop-hint { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #666; font-size: 13px; pointer-events: none; text-align: center; line-height: 1.8; }
  .drop-hint .big { font-size: 42px; margin-bottom: 12px; color: #444; }
  .drop-hint.dragging { color: #ffcc00; background: rgba(255,204,0,0.05); border: 3px dashed #ffcc00; border-radius: 8px; }
  .img-stage.drag-over .drop-hint { display: flex; }
  #fileInput { display: none; }
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <h2>样图 <span>（直接点开看）</span></h2>
    <p class="hint">内置几张覆盖不同条件的录制帧：夜里/白天、面板两种朝向、卡片淡入中、横幅最长。</p>
    <div id="samples"></div>

    <h2>其他帧 <span>（本地录制库）</span></h2>
    <select id="sessionSel"></select>
    <select id="frameSel"></select>
    <div class="btn-row">
      <button class="btn secondary" id="btnPrev">上一帧</button>
      <button class="btn secondary" id="btnNext">下一帧</button>
    </div>
    <button class="btn secondary" id="btnImport">导入本地图片 / 粘贴</button>
    <input type="file" id="fileInput" accept="image/*">

    <h2>区域 <span id="regionCount"></span></h2>
    <p class="hint">拖框移动、拖四角改大小、方向键微调 1px（Shift 10px）。改动只在这里，不落盘。</p>
    <div class="region-list" id="regionList"></div>

    <div class="btn-row">
      <button class="btn" id="btnDumpJson">复制区域 JSON</button>
      <button class="btn secondary" id="btnLoadJson">粘贴 JSON 载入</button>
    </div>
    <textarea id="jsonBox" spellcheck="false" placeholder="区域 JSON（点「复制区域 JSON」会填到这里并复制到剪贴板；也可以把改好的 JSON 粘回来点「粘贴 JSON 载入」）"></textarea>
    <div class="readout" id="readout"></div>
    <div class="sem" id="semantics"></div>
  </div>

  <div class="main">
    <div class="toolbar">
      <span id="imgInfo">未加载图片</span>
      <span id="mouseInfo"></span>
      <span id="identInfo"></span>
      <span id="diffInfo"></span>
      <span style="margin-left:auto;">坐标 = 归一化 [x1, y1, x2, y2]，左上原点，右/下边**排他**</span>
    </div>
    <div class="canvas-wrap">
      <div class="img-stage" id="imgStage">
        <img id="previewImg" alt="" style="display:none;">
        <div class="overlay" id="overlay"></div>
        <div class="drop-hint" id="dropHint">
          <div class="big">⬇</div>
          <div>点左侧样图加载录制帧（需要 Studio 服务在跑）<br>或把图片拖到这里 / Ctrl+V 粘贴 / 点「导入本地图片」</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* =======================================================================
 * HUD ROI Tuner — 极速狂飙驾驶页 HUD 区域调整（给维护者复核 ROI 用）
 *
 * 三条与模板裁切工具**不同**的设计约定，都是为了让这份产物能直接回填真源：
 *   1. 内部一律以**归一化坐标** [x1,y1,x2,y2] 存储（真源就是这个形态）——
 *      不引入像素存储再换算，少一层会累积舍入的转换。像素值只用于显示与微调。
 *   2. 区域集**从真源读**（Studio 的 /api/rois → speedrush_hud 组），本页不内置一份
 *      矩形常量：内置一份就是第二份真相，改了真源页面还停在旧的。
 *   3. 每格实时算**判据量**（在场闸门的暗底占比、归属判据的蓝偏移），并在图上标出来——
 *      复核 ROI 时要回答的不是"框好不好看"，而是"这条判据在这张图上还成不成立"。
 *
 * 读数走 Studio 既有的 /api/speedrush/ocr（真引擎、真录制帧），不在这里再造一个 OCR。
 * 本页只读：不写任何文件，改好的矩形由「复制区域 JSON」带回去改真源。
 * ===================================================================== */

// ---------- 常量：与真源/插件的判据口径一致（改这里必须同步改插件） ----------
// 在场闸门（hud.field_on_dark）：ROI 内暗像素占比 > FIELD_DARK_MIN 即认为面板在场
const DARK_LUM_MAX = 90;      // 亮度低于此值算"暗"
const FIELD_DARK_MIN = 0.35;  // 暗底占比阈值
// 归属判据（hud.pair_sides / band_blue_bias）：条带内最饱和一撮的 B−R
const SIDE_MIN_SAT = 80;      // 饱和度下限（低于它的像素不参与）
const SIDE_TOP_QUANTILE = 0.95;
const SIDE_PAIR_MIN_DELTA = 40;
// 参考分辨率：像素读数按它算（归一化坐标与分辨率无关）
const REF_W = 1280, REF_H = 720;

// 字段语义：名字 → 面板/格位、读法、判据上的注意事项。**这段就是"各个变量代表什么"**。
// 右侧两块面板的四个名字是**槽位名**（a=上档、b=下档）——位置名不等于敌我：面板会上下
// 互换，敌我由块色**成对判**（两块之差）得出。得分速度**只为本方显示**，对手那一槽没有这
// 个读数（框到的是背景，读出来只会是垃圾）。
const FIELDS = [
  { name: 'stage',        label: '阶段号',   side: 'left',   note: '「阶段:1 / 阶段:2」那一行，取整得 1/2' },
  { name: 'timer',        label: '阶段计时', side: 'left',   note: 'mm:ss 倒计时；值按**秒**记（04:46 → 286），别按分钟读' },
  { name: 'mileage',      label: '里程',     side: 'left',   note: '左侧卡片第一格**数字**（不含上方「里程」二字）；只框数字' },
  { name: 'overtake',     label: '超车',     side: 'left',   note: '左侧卡片第二格数字；合法域含单字（0~5），别当假读' },
  { name: 'total_left',   label: '合计',     side: 'left',   note: '左侧卡片第三格数字；**只在淡入完成后才出现**，淡入中框到的是空的暗底' },
  { name: 'score_a',      label: '比分·上槽', side: 'right', note: '上档槽位的分数（**这是槽位，不是敌我**）；只框数字，别带姓名牌/血量条' },
  { name: 'score_b',      label: '比分·下槽', side: 'right', note: '下档槽位的分数（槽位同理）' },
  { name: 'rate_a',       label: '速度·上槽', side: 'right', note: '上档槽位的「得分速度」——**只在本槽是蓝（本方）时有读数**' },
  { name: 'rate_b',       label: '速度·下槽', side: 'right', note: '下档槽位同理；本槽是红（对手）时那是空区，没有这个读数' },
  { name: 'event_banner', label: '事件横幅', side: 'left',   note: '「极限超车 ×N / 极限变道」；会从 4 字长到 6~7 字，右边界要留够' },
];

// 内置样图：session + 帧文件名 + 一句话说明"这张图要看什么"。都是录制的真帧。
const SAMPLES = [
  { session: '20260917_200445_p1', file: '000182.jpg', t: '夜里深色背景 · 卡片定值', why: '本机蓝在上；卡片三格定值（338 / 1 / 368）' },
  { session: '20260917_220453_p1', file: '000193.jpg', t: '白天蓝天 · 面板互换',   why: '本机蓝在**下**；蓝天背景会把两块都染蓝（归属判据的现场）' },
  { session: '20260917_200445_p1', file: '000471.jpg', t: '卡片淡入中',           why: '半透明、数字滚动、「合计」那一行还没出来' },
  { session: '20260917_200445_p1', file: '000318.jpg', t: '卡片淡入中（另一形态）', why: '里程爬到 317 还没停；此时三格读数都不可信' },
  { session: '20260917_220750_p2', file: '000368.jpg', t: '事件横幅最长',          why: '「极限超车 ×N」连击计数；看右边界会不会切掉 ×N' },
  { session: '20260917_220750_p2', file: '000058.jpg', t: '阶段 2 起步',           why: '计时从 05:00 起、阶段号 2；左侧卡片与阶段 1 同位置' },
];

// ---------- 状态 ----------
const state = {
  image: null,        // { w, h, src, name, source }
  truth: {},          // 真源 { name: [x1,y1,x2,y2] }（用于对比与重置）
  regions: {},        // 当前 { name: [x1,y1,x2,y2] }
  selected: null,
  creating: null,
  dragging: null,
  stats: {},          // name → { dark, blue }（本次图像上的实时判据量）
  ident: {},          // name → '蓝(本机)'/'红(对手)'/'?'（成对判出的归属，只对右侧四格有意义）
  colorOf: {},
};
const COLORS = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#a8e6cf', '#ff8b94', '#6c5ce7', '#00b894', '#fd79a8', '#e17055', '#00cec9'];

const $ = (id) => document.getElementById(id);
const previewImg = $('previewImg'), imgStage = $('imgStage'), overlay = $('overlay');
const dropHint = $('dropHint'), fileInput = $('fileInput');
const clamp = (v, lo, hi) => Math.max(lo, Math.min(v, hi));
const fmt6 = (v) => Number(v).toFixed(6).replace(/0+$/, '').replace(/\.$/, '.0');
const px = (v, ref) => Math.round(v * ref);

// ---------- 真源载入 ----------
async function loadTruth() {
  try {
    const r = await fetch('/api/rois');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const grp = (data.rois || data)['speedrush_hud'];
    if (!grp) throw new Error('响应里没有 speedrush_hud 组');
    const out = {};
    for (const [name, v] of Object.entries(grp)) out[name] = v.rect.map(Number);
    state.truth = out;
    state.regions = JSON.parse(JSON.stringify(out));
    assignColors();
    renderRegionList();
    updateDiff();
    return true;
  } catch (e) {
    $('jsonBox').placeholder = '读真源失败（' + e.message + '）：可手动粘贴区域 JSON 后点「粘贴 JSON 载入」';
    return false;
  }
}

function assignColors() {
  Object.keys(state.regions).forEach((n, i) => { state.colorOf[n] = COLORS[i % COLORS.length]; });
}

// ---------- 图像载入 ----------
function setImage(src, name, source, w, h) {
  state.image = { w, h, src, name, source };
  state.stats = {};
  // 先挂 onload 再设 src：反过来时缓存命中的图可能在处理器挂上之前就 load 完，
  // 表现是"第一次能画、再点同一张就空白"。
  previewImg.onload = () => requestAnimationFrame(() => { computeAllStats(); renderBoxes(); });
  previewImg.src = src;
  previewImg.style.display = 'block';
  dropHint.style.display = 'none';
  $('imgInfo').textContent = `${name} — ${w} × ${h} px${source ? '（' + source + '）' : ''}`;
}

// 窗口缩放会改变图片在 stage 内的渲染矩形，框必须重画（否则看着错位、其实数据没错）
window.addEventListener('resize', () => { if (state.image) renderBoxes(); });

function loadUrl(url, name, source) {
  const img = new Image();
  img.onload = () => setImage(url, name, source, img.naturalWidth, img.naturalHeight);
  img.onerror = () => { $('imgInfo').textContent = '帧加载失败：' + name + '（Studio 服务在跑吗？）'; };
  img.src = url;
}

function loadSample(s) {
  document.querySelectorAll('.sample').forEach(el => el.classList.toggle('active', el.dataset.file === s.file && el.dataset.session === s.session));
  loadUrl(`/api/speedrush/image?session=${encodeURIComponent(s.session)}&name=${encodeURIComponent(s.file)}`,
          `${s.session}/${s.file}`, s.t);
}

function loadLocalFile(file, nameHint) {
  const name = (file && file.name) || nameHint || 'local.png';
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => setImage(e.target.result, name, '本地图片', img.naturalWidth, img.naturalHeight);
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// 拖入 / 粘贴（没有 Studio 服务时也能用）
['dragover', 'drop'].forEach(ev => window.addEventListener(ev, e => e.preventDefault()));
['dragenter', 'dragover'].forEach(ev => imgStage.addEventListener(ev, () => { imgStage.classList.add('drag-over'); dropHint.classList.add('dragging'); }));
imgStage.addEventListener('dragleave', () => { imgStage.classList.remove('drag-over'); dropHint.classList.remove('dragging'); });
imgStage.addEventListener('drop', (e) => {
  imgStage.classList.remove('drag-over'); dropHint.classList.remove('dragging');
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadLocalFile(f);
});
document.addEventListener('paste', (e) => {
  const dt = e.clipboardData;
  if (!dt) return;
  let f = null;
  if (dt.files && dt.files.length) f = Array.from(dt.files).find(x => !x.type || x.type.startsWith('image/'));
  if (!f && dt.items) for (const it of dt.items) { if (it.kind === 'file') { const c = it.getAsFile(); if (c) { f = c; break; } } }
  if (f) { e.preventDefault(); loadLocalFile(f, 'clipboard.png'); }
});
$('btnImport').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => { const f = e.target.files[0]; if (f) loadLocalFile(f); e.target.value = ''; });

// ---------- 坐标映射（图片在 stage 内居中 contain） ----------
function getImageView() {
  if (!state.image) return null;
  const r = previewImg.getBoundingClientRect();
  if (!r.width || !r.height) return null;
  const st = imgStage.getBoundingClientRect();
  return {
    ox: r.left - st.left, oy: r.top - st.top, w: r.width, h: r.height,
    nx: 1 / r.width, ny: 1 / r.height,   // stage px → 归一化
  };
}
function stageToNorm(cx, cy) {
  const v = getImageView(); if (!v) return null;
  return { x: clamp((cx - v.ox) * v.nx, 0, 1), y: clamp((cy - v.oy) * v.ny, 0, 1) };
}
function normToStage(x, y) {
  const v = getImageView(); if (!v) return null;
  return { x: v.ox + x * v.w, y: v.oy + y * v.h };
}
function stagePoint(e) {
  const r = imgStage.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

// ---------- 判据量：暗底占比 + 蓝偏移（与插件口径同源） ----------
function computeAllStats() {
  if (!state.image) return;
  let cv = document.createElement('canvas');
  cv.width = state.image.w; cv.height = state.image.h;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(previewImg, 0, 0);
  let data;
  try { data = ctx.getImageData(0, 0, cv.width, cv.height).data; }
  catch (e) { $('diffInfo').textContent = '判据量不可用（图片跨源，canvas 被污染）'; return; }
  for (const [name, rect] of Object.entries(state.regions)) state.stats[name] = statOf(data, cv.width, cv.height, rect);
  resolveIdentity();
}

// 归属**成对判**（与插件同一条判据）：两块比分条带的蓝偏移之差 ≥ 阈值才判得出，
// 差值太小则两块都弃权。速度格跟随同槽位的比分格。页面上把结果标在框上——
// 调框时要能直接看出"这个框现在是谁的"。
function resolveIdentity() {
  state.ident = {};
  const a = state.stats['score_a'], b = state.stats['score_b'];
  if (!a || !b || a.blue === null || b.blue === null) return;
  const d = a.blue - b.blue;
  if (Math.abs(d) < SIDE_PAIR_MIN_DELTA) {
    state.ident['score_a'] = state.ident['score_b'] = '?（两块太近）';
    return;
  }
  const top = d > 0 ? '蓝(本机)' : '红(对手)';
  const bot = d > 0 ? '红(对手)' : '蓝(本机)';
  state.ident['score_a'] = top; state.ident['score_b'] = bot;
  state.ident['rate_a'] = top; state.ident['rate_b'] = bot;   // 速度格跟随同槽
  $('identInfo').textContent = `归属（成对判）：上槽 ${top} · 下槽 ${bot} · 蓝偏移差 ${d.toFixed(0)}` +
    (state.ident['rate_a'] === '红(对手)' || state.ident['rate_b'] === '红(对手)'
      ? '　→ 红那一槽没有得分速度，不该有读数' : '');
}

function statOf(data, W, H, rect) {
  const x1 = clamp(Math.round(rect[0] * W), 0, W), y1 = clamp(Math.round(rect[1] * H), 0, H);
  const x2 = clamp(Math.round(rect[2] * W), 0, W), y2 = clamp(Math.round(rect[3] * H), 0, H);
  let n = 0, dark = 0;
  const sats = [], blues = [];
  for (let y = y1; y < y2; y++) {
    for (let x = x1; x < x2; x++) {
      const i = (y * W + x) * 4;
      const r = data[i], g = data[i + 1], b = data[i + 2];
      n++;
      if ((r + g + b) / 3 < DARK_LUM_MAX) dark++;
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      if (mx - mn > SIDE_MIN_SAT) { sats.push(mx - mn); blues.push(b - r); }
    }
  }
  if (!n) return { dark: 0, blue: null, sat: 0 };
  let blue = null;
  if (sats.length >= 50) {
    const sorted = sats.slice().sort((a, b) => a - b);
    const cut = sorted[Math.min(sorted.length - 1, Math.floor(SIDE_TOP_QUANTILE * sorted.length))];
    let s = 0, k = 0;
    for (let j = 0; j < sats.length; j++) if (sats[j] >= cut) { s += blues[j]; k++; }
    blue = k ? s / k : null;
  }
  return { dark: dark / n, blue, sat: sats.length };
}

// ---------- 绘制 ----------
function renderBoxes() {
  overlay.innerHTML = '';
  const v = getImageView(); if (!v) return;
  for (const [name, rect] of Object.entries(state.regions)) {
    const a = normToStage(rect[0], rect[1]), b = normToStage(rect[2], rect[3]);
    if (!a || !b) return;
    const w = b.x - a.x, h = b.y - a.y;
    const box = document.createElement('div');
    box.className = 'region-box' + (name === state.selected ? ' selected' : '');
    box.style.left = a.x + 'px'; box.style.top = a.y + 'px';
    box.style.width = w + 'px'; box.style.height = h + 'px';
    box.style.borderColor = state.colorOf[name];
    box.style.background = state.colorOf[name] + '22';
    box.dataset.name = name;
    const lab = document.createElement('div');
    lab.className = 'label';
    lab.style.background = state.colorOf[name];
    const st = state.stats[name];
    const id = state.ident[name];
    lab.textContent = `${name}${id ? ' ' + id : ''}${st ? ` 暗${(st.dark * 100).toFixed(0)}%${st.blue === null ? '' : ` 蓝${st.blue.toFixed(0)}`}` : ''}`;
    box.appendChild(lab);
    for (const cls of ['nw-n', 'ne-n', 'sw-n', 'se-n']) {
      const hd = document.createElement('div');
      hd.className = 'handle ' + cls; hd.dataset.mode = cls.slice(0, 2);
      box.appendChild(hd);
    }
    overlay.appendChild(box);
  }
  renderRegionList();
}

// ---------- 区域列表 + 输入框 ----------
function renderRegionList() {
  const box = $('regionList');
  box.innerHTML = '';
  const names = Object.keys(state.regions);
  $('regionCount').textContent = `(${names.length})`;
  for (const name of names) {
    const rect = state.regions[name];
    const meta = FIELDS.find(f => f.name === name) || { label: '', note: '' };
    const st = state.stats[name];
    const el = document.createElement('div');
    el.className = 'region-item' + (name === state.selected ? ' selected' : '');
    const pxw = px(rect[2] - rect[0], REF_W), pxh = px(rect[3] - rect[1], REF_H);
    const gateBad = meta.side === 'left' && name !== 'stage' && name !== 'timer' && st && st.dark < FIELD_DARK_MIN;
    const id = state.ident[name];
    const isRateNotOurs = (name === 'rate_a' || name === 'rate_b') && id === '红(对手)';
    el.innerHTML =
      `<div class="row1"><span class="color-dot" style="background:${state.colorOf[name]}"></span>` +
      `<span class="nm">${name}</span>` +
      (id ? `<span class="px" style="color:${id.startsWith('蓝') ? '#6cf' : '#f88'}">${id}</span>` : '') +
      `<span class="px">${pxw}×${pxh}px</span></div>` +
      `<div class="stat${gateBad || isRateNotOurs ? ' bad' : ''}">` +
      (isRateNotOurs ? '对手那一槽没有得分速度：这里本该读不到东西（读到数字就是框歪了/假读）'
        : st ? `暗底 ${(st.dark * 100).toFixed(0)}%${gateBad ? '（低于闸门 35%，面板不在场）' : ''}` +
             (st.blue === null ? '' : ` · 蓝偏移 ${st.blue.toFixed(0)}`) : '（等图加载）') +
      `</div>` +
      `<div class="fields">` + ['x1', 'y1', 'x2', 'y2'].map((k, i) =>
        `<label>${k}<input data-name="${name}" data-i="${i}" type="number" step="0.0005" value="${fmt6(rect[i])}"></label>`).join('') +
      `</div>`;
    el.addEventListener('click', (e) => { if (e.target.tagName !== 'INPUT') { state.selected = name; renderBoxes(); } });
    box.appendChild(el);
  }
  box.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('change', () => {
      const name = inp.dataset.name, i = Number(inp.dataset.i);
      const v = Number(inp.value);
      if (!Number.isFinite(v)) return;
      const rect = state.regions[name];
      rect[i] = clamp(v, 0, 1);
      if (rect[2] <= rect[0]) rect[2] = Math.min(1, rect[0] + 0.002);
      if (rect[3] <= rect[1]) rect[3] = Math.min(1, rect[1] + 0.002);
      state.selected = name;
      computeAllStats(); renderBoxes(); updateDiff();
    });
  });
}

// ---------- 拖拽：移动 / 四角缩放 / 新建 ----------
imgStage.addEventListener('mousedown', (e) => {
  if (!state.image || e.button !== 0) return;
  const p = stagePoint(e);
  const handle = e.target.closest('.handle');
  const boxEl = e.target.closest('.region-box');
  if (handle && boxEl) {
    const name = boxEl.dataset.name;
    state.selected = name;
    state.dragging = { name, mode: handle.dataset.mode, start: p, orig: state.regions[name].slice() };
    e.preventDefault(); return;
  }
  if (boxEl) {
    const name = boxEl.dataset.name;
    state.selected = name;
    state.dragging = { name, mode: 'move', start: p, orig: state.regions[name].slice() };
    renderBoxes(); e.preventDefault(); return;
  }
  const n = stageToNorm(p.x, p.y);
  if (!n) return;
  state.creating = { start: p, rect: [n.x, n.y, n.x, n.y] };
});

window.addEventListener('mousemove', (e) => {
  if (state.image) {
    const p = stagePoint(e), n = stageToNorm(p.x, p.y);
    if (n) $('mouseInfo').textContent = `鼠标 ${n.x.toFixed(4)}, ${n.y.toFixed(4)}  ·  px ${px(n.x, REF_W)}, ${px(n.y, REF_H)}`;
  }
  if (state.dragging) {
    const d = state.dragging, p = stagePoint(e);
    const v = getImageView(); if (!v) return;
    const dx = (p.x - d.start.x) * v.nx, dy = (p.y - d.start.y) * v.ny;
    const o = d.orig, r = o.slice();
    if (d.mode === 'move') {
      const w = o[2] - o[0], h = o[3] - o[1];
      r[0] = clamp(o[0] + dx, 0, 1 - w); r[1] = clamp(o[1] + dy, 0, 1 - h);
      r[2] = r[0] + w; r[3] = r[1] + h;
    } else {
      if (d.mode.includes('w')) r[0] = clamp(o[0] + dx, 0, o[2] - 0.002);
      if (d.mode.includes('e')) r[2] = clamp(o[2] + dx, o[0] + 0.002, 1);
      if (d.mode.includes('n')) r[1] = clamp(o[1] + dy, 0, o[3] - 0.002);
      if (d.mode.includes('s')) r[3] = clamp(o[3] + dy, o[1] + 0.002, 1);
    }
    state.regions[d.name] = r;
    renderBoxes();
    return;
  }
});

window.addEventListener('mouseup', () => {
  if (state.dragging) { state.dragging = null; computeAllStats(); renderBoxes(); updateDiff(); return; }
  if (state.creating) {
    const c = state.creating; state.creating = null;
    const el = overlay.querySelector('.creating-box'); if (el) el.remove();
    // 新建：套到当前选中区域名下（区域集由真源决定，不允许凭空增删）
    if (state.selected && Math.abs(c.rect[2] - c.rect[0]) > 0.004 && Math.abs(c.rect[3] - c.rect[1]) > 0.004) {
      state.regions[state.selected] = [Math.min(c.rect[0], c.rect[2]), Math.min(c.rect[1], c.rect[3]),
                                       Math.max(c.rect[0], c.rect[2]), Math.max(c.rect[1], c.rect[3])];
      computeAllStats(); renderBoxes(); updateDiff();
    }
  }
});

// 拖拽中的虚线框（每次 mousemove 重画一次，代价可忽略）
imgStage.addEventListener('mousemove', (e) => {
  if (!state.creating) return;
  const p = stagePoint(e), n = stageToNorm(p.x, p.y);
  state.creating.rect = [state.creating.rect[0], state.creating.rect[1], n.x, n.y];
  let el = overlay.querySelector('.creating-box');
  if (!el) { el = document.createElement('div'); el.className = 'creating-box'; overlay.appendChild(el); }
  const r = state.creating.rect;
  const a = normToStage(Math.min(r[0], r[2]), Math.min(r[1], r[3]));
  const b = normToStage(Math.max(r[0], r[2]), Math.max(r[1], r[3]));
  el.style.left = a.x + 'px'; el.style.top = a.y + 'px';
  el.style.width = (b.x - a.x) + 'px'; el.style.height = (b.y - a.y) + 'px';
});

// 方向键微调（1px；Shift = 10px）
window.addEventListener('keydown', (e) => {
  if (!state.selected || !state.image) return;
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  const map = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (!map[e.key]) return;
  const step = (e.shiftKey ? 10 : 1) / (e.ctrlKey || e.altKey ? 1 : 1);
  const dx = map[e.key][0] * step / REF_W, dy = map[e.key][1] * step / REF_H;
  const r = state.regions[state.selected];
  // 默认整体移动；按住 Ctrl/Alt 只动右/下边（改大小）
  if (e.ctrlKey || e.altKey) { r[2] = clamp(r[2] + dx, r[0] + 0.002, 1); r[3] = clamp(r[3] + dy, r[1] + 0.002, 1); }
  else { r[0] = clamp(r[0] + dx, 0, 1); r[1] = clamp(r[1] + dy, 0, 1); r[2] = clamp(r[2] + dx, 0, 1); r[3] = clamp(r[3] + dy, 0, 1); }
  e.preventDefault();
  computeAllStats(); renderBoxes(); updateDiff();
});

// ---------- 读数（走 Studio 既有端点，真引擎 + 真录制帧） ----------
async function readRegion(name) {
  const s = state.image && state.image.source;
  if (!state.image || !state.image.name.includes('/')) {
    $('readout').innerHTML = `<span class="txt">读数需要录制帧（从左侧样图或本地录制库打开），本地导入的图没有会话上下文</span>`;
    return;
  }
  const [session, file] = state.image.name.split('/');
  $('readout').innerHTML = '读数中…';
  try {
    const r = await fetch('/api/speedrush/ocr', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session, image: file, rect: state.regions[name] }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    $('readout').innerHTML =
      `<b>${name}</b> 读数：<span class="txt">${d.text === '' ? '(空)' : JSON.stringify(d.text)}</span>` +
      (d.lines && d.lines.length > 1 ? `<br>逐块：<span class="txt">${JSON.stringify(d.lines)}</span>` : '') +
      (d.crop_size ? `<br>抠图 ${d.crop_size[0]}×${d.crop_size[1]} px · ${d.duration_ms}ms` : '') +
      (d.crop_preview ? `<img src="${d.crop_preview}" alt="crop">` : '');
  } catch (e) {
    $('readout').innerHTML = `<span class="txt">读数失败：${e.message}</span>`;
  }
}

// ---------- 差异 / 输出 ----------
function updateDiff() {
  const names = Object.keys(state.regions);
  const diffs = [];
  for (const n of names) {
    const t = state.truth[n], c = state.regions[n];
    if (!t) { diffs.push(`${n}: 真源没有这一项`); continue; }
    const d = [0, 1, 2, 3].map(i => Math.round((c[i] - t[i]) * (i % 2 ? REF_H : REF_W)));
    if (d.some(v => v !== 0)) diffs.push(`${n} Δpx(${d.join(',')})`);
  }
  $('diffInfo').textContent = diffs.length ? `改动 ${diffs.length} 处：${diffs.join(' · ')}` : '未改动（与真源一致）';
}

function dumpJson() {
  const ordered = FIELDS.map(f => f.name).filter(n => state.regions[n]);
  const extra = Object.keys(state.regions).filter(n => !ordered.includes(n));
  const lines = [...ordered, ...extra].map(n =>
    `  "${n}": [${state.regions[n].map(v => Number(v.toFixed(6))).join(', ')}]`);
  const txt = '{\n' + lines.join(',\n') + '\n}';
  $('jsonBox').value = txt;
  navigator.clipboard && navigator.clipboard.writeText(txt).catch(() => {});
  $('readout').innerHTML = '<span class="txt">已复制到剪贴板（也填在下方框里）</span>';
  return txt;
}

function loadJson() {
  try {
    const obj = JSON.parse($('jsonBox').value);
    const out = {};
    for (const [k, v] of Object.entries(obj)) {
      if (k.startsWith('_') || !Array.isArray(v) || v.length !== 4) continue;
      out[k] = v.map(Number);
    }
    if (!Object.keys(out).length) throw new Error('没解析出任何 4 元区域');
    state.regions = out;
    assignColors();
    computeAllStats(); renderBoxes(); updateDiff();
    $('readout').innerHTML = `<span class="txt">已载入 ${Object.keys(out).length} 个区域</span>`;
  } catch (e) {
    $('readout').innerHTML = `<span class="txt">JSON 载入失败：${e.message}</span>`;
  }
}

$('btnDumpJson').addEventListener('click', dumpJson);
$('btnLoadJson').addEventListener('click', loadJson);

// 区域名点击 = 选中 + 读数（两件事一起做：调框时最常问的就是"这框现在读到什么"）
$('regionList').addEventListener('dblclick', (e) => {
  const el = e.target.closest('.region-item');
  if (!el) return;
  const name = el.querySelector('.nm').textContent;
  state.selected = name; renderBoxes(); readRegion(name);
});

// ---------- 初始化 ----------
function renderSamples() {
  const box = $('samples');
  SAMPLES.forEach(s => {
    const el = document.createElement('div');
    el.className = 'sample';
    el.dataset.file = s.file; el.dataset.session = s.session;
    el.innerHTML = `<div class="t">${s.t}</div><div class="why">${s.session.slice(-11)}/${s.file} — ${s.why}</div>`;
    el.addEventListener('click', () => loadSample(s));
    box.appendChild(el);
  });
}

async function initSessions() {
  try {
    const r = await fetch('/api/speedrush/list_sessions');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const list = await r.json();
    const sel = $('sessionSel');
    sel.innerHTML = list.map(s => `<option value="${s}">${s}</option>`).join('');
    await loadFrames(list[0]);
    sel.addEventListener('change', () => loadFrames(sel.value));
  } catch (e) {
    $('sessionSel').innerHTML = '<option>（本地录制库不可用：Studio 未运行？）</option>';
    $('frameSel').innerHTML = '';
  }
}

async function loadFrames(session) {
  try {
    const r = await fetch('/api/speedrush/list_images?session=' + encodeURIComponent(session));
    const list = await r.json();
    $('frameSel').innerHTML = list.map(f => `<option value="${f}">${f}</option>`).join('');
    $('frameSel').dataset.session = session;
  } catch (e) { $('frameSel').innerHTML = ''; }
}

function stepFrame(delta) {
  const sel = $('frameSel');
  if (!sel.options.length) return;
  const i = clamp(sel.selectedIndex + delta, 0, sel.options.length - 1);
  sel.selectedIndex = i;
  openFrame();
}
function openFrame() {
  const session = $('frameSel').dataset.session;
  const file = $('frameSel').value;
  if (!session || !file) return;
  loadUrl(`/api/speedrush/image?session=${encodeURIComponent(session)}&name=${encodeURIComponent(file)}`,
          `${session}/${file}`, '本地录制库');
}
$('frameSel').addEventListener('change', openFrame);
$('btnPrev').addEventListener('click', () => stepFrame(-1));
$('btnNext').addEventListener('click', () => stepFrame(1));

function renderSemantics() {
  $('semantics').innerHTML =
    '<b>rect = [x1, y1, x2, y2]</b>：归一化（÷1280×720）、左上原点、<b>x2/y2 排他</b>，' +
    '须满足 x1&lt;x2、y1&lt;y2、值在 0~1。真源 = <b>plugins/speedrush/resources/policy/hud_regions.json</b>。<br>' +
    FIELDS.map(f => `<b>${f.name}</b>（${f.label}）：${f.note}`).join('<br>') +
    `<br><br><b>页面上两个统计</b>：<b>暗底%</b> = 框内亮度均值 &lt; ${DARK_LUM_MAX} 的像素占比（面板三格的**在场闸门**：低于 ${FIELD_DARK_MIN} 即判"不在场"、不识别）；` +
    `<b>蓝偏移</b> = 框内饱和度 &gt; ${SIDE_MIN_SAT} 的像素里取饱和最高的 ${Math.round((1 - SIDE_TOP_QUANTILE) * 100)}%，其 (蓝−红) 均值（**归属判据**用的就是它，两块之差 &lt; ${SIDE_PAIR_MIN_DELTA} 则两块都弃权）。`;
}

(async function main() {
  renderSamples();
  renderSemantics();
  await loadTruth();
  renderRegionList();
  await initSessions();
})();
</script>
