<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NavKit · ROI 校准器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="toolbar">
  <div class="controls">
    <label>会话
      <select id="sessionSelect"></select>
    </label>
    <label>截图
      <select id="imageSelect"></select>
    </label>
    <button id="undoBtn" class="btn" title="Ctrl+Z">↶ 撤销</button>
    <button id="redoBtn" class="btn" title="Ctrl+Y">↷ 重做</button>
    <button id="saveBtn" class="btn primary">💾 保存 JSON</button>
    <button id="testBtn" class="btn">⚡ 跨帧测试</button>
    <span id="statusMsg"></span>
  </div>
</header>

<main class="layout">
  <!-- 左栏：显示设置 + 分类 tab + ROI 列表 -->
  <aside class="panel left">
    <div class="view-opts">
      <label>框
        <select id="roiShowMode">
          <option value="all" selected>全部</option>
          <option value="selected">仅选中</option>
          <option value="none">不显示</option>
        </select>
      </label>
      <label class="chk"><input type="checkbox" id="showHit" checked> 命中位置</label>
    </div>
    <div id="catTabs"></div>
    <div id="roiList"></div>
  </aside>

  <!-- 中栏：Canvas -->
  <section class="panel center">
    <div class="canvas-wrap">
      <canvas id="stage"></canvas>
      <div id="canvasHint">拖拽创建 ROI · 选中后拖内部移动 · 拖右下角缩放 · Delete 删除</div>
    </div>
    <!-- 非 OCR 分类：Crop 抠图 + Tpl 模板 并排（原设计）；OCR 分类：抠图左 + OCR结果右 -->
    <div id="previewRow" class="preview-row preview-template">
      <div class="preview-box preview-crop">
        <div class="preview-title">当前 ROI 抠图</div>
        <img id="cropPreview" alt="">
      </div>
      <div class="preview-box preview-tpl">
        <div class="preview-title">Tpl（模板）</div>
        <img id="tplPreview" alt="">
      </div>
      <div class="preview-box preview-ocr hidden">
        <div class="preview-title">OCR 识别结果（RapidOCR）</div>
        <div id="ocrResult" class="ocr-result"><div class="ocr-empty">—</div></div>
      </div>
    </div>
  </section>

  <!-- 右栏：属性面板 -->
  <aside class="panel right">
    <div id="propPanel">
      <div class="empty">← 在左侧选择一个 ROI</div>
    </div>
  </aside>
</main>

<!-- 跨帧测试结果 -->
<div id="testModal" class="modal hidden">
  <div class="modal-body">
    <div class="modal-head">
      <span>跨帧测试结果</span>
      <button id="closeTest" class="btn">&times;</button>
    </div>
    <pre id="testResult"></pre>
  </div>
</div>

<script>new EventSource("/api/events");</script>
<script type="module" src="app.js"></script>
</body>
</html>
