<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>性能监控卡</title>
<!-- 性能监控卡设计稿（未实施）。面板接入会改动玩法插件的观测面，而 speedrush 尚未定型，
     故先停在样式层：本页只提供视觉与信息层级参照，实施时以当期性能面板契约为准。 -->
<style>
:root{
  --mra-background:#F5F6FA; --mra-surface:#FFFFFF; --mra-surface-hover:#F7F8FB;
  --mra-foreground:#1F2328; --mra-foreground-secondary:#4A5160;
  --mra-foreground-muted:#8B93A7; --mra-foreground-dim:#B0B7C3;
  --mra-border:#E5E7EB; --mra-border-light:#EEF0F4;
  --mra-success:#10B981; --mra-warning:#F59E0B; --mra-danger:#EF4444; --mra-info:#3B82F6;
  --mra-font-sans:"Noto Sans SC","Microsoft YaHei UI","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  --pad:18px;
  --rail:-8px;
}
*{box-sizing:border-box}
body{margin:0;padding:26px 24px 40px;background:var(--mra-background);color:var(--mra-foreground);
  font-family:var(--mra-font-sans);-webkit-font-smoothing:antialiased}
.stage{max-width:600px;margin:0 auto}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.toolbar-title{font-size:12px;color:var(--mra-foreground-muted)}
.seg{display:flex;background:#ECEEF3;border-radius:7px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:5px;font-size:12px;
  font-family:inherit;color:var(--mra-foreground-secondary);cursor:pointer}
.seg button.on{background:#fff;color:var(--mra-foreground);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06)}

.card{background:var(--mra-surface);border:1px solid var(--mra-border);border-radius:10px;
  box-shadow:0 1px 2px rgba(0,0,0,.04);overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;
  padding:14px var(--pad) 13px;border-bottom:1px solid var(--mra-border-light)}
.card-head h3{margin:0;font-size:13.5px;font-weight:600;letter-spacing:.01em;line-height:1}
.head-state{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;line-height:1}
.head-state i{width:6px;height:6px;border-radius:50%;flex:none}
.head-state--ok{color:var(--mra-success)} .head-state--ok i{background:var(--mra-success)}
.head-state--warn{color:var(--mra-warning)} .head-state--warn i{background:var(--mra-warning)}
.head-state--error{color:var(--mra-danger)} .head-state--error i{background:var(--mra-danger)}
.head-state--idle{color:var(--mra-foreground-dim)} .head-state--idle i{background:var(--mra-foreground-dim)}
.head-state b{font-weight:500;color:var(--mra-foreground-dim);margin-left:3px}
.card-body{padding:16px var(--pad) var(--pad)}

.kpis{display:grid;grid-template-columns:1fr 1fr;column-gap:20px}
.kpi{min-width:0}
.kpi + .kpi{border-left:1px solid var(--mra-border-light);padding-left:20px}
.kpi-label{font-size:11px;color:var(--mra-foreground-muted);line-height:1;margin-bottom:7px}
.kpi-num{display:flex;align-items:baseline;gap:2px;line-height:1;margin-bottom:9px}
.kpi-num b{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi-num span{font-size:11px;color:var(--mra-foreground-muted);font-weight:500}
.kpi-num--warn b{color:var(--mra-warning)} .kpi-num--error b{color:var(--mra-danger)}
.kpi-spark{display:block;width:100%;height:28px}

.rule{height:1px;background:var(--mra-border-light);margin:18px 0 14px}

.sect{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.sect-title{font-size:11px;font-weight:500;color:var(--mra-foreground-muted);letter-spacing:.06em}
.sect-meta{font-size:10.5px;color:var(--mra-foreground-dim)}

.rows{margin:0 var(--rail)}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:7px 8px}
.row-label{font-size:12.5px;color:var(--mra-foreground-secondary);white-space:nowrap}
.row-val{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-val--text{font-weight:400;color:var(--mra-foreground-secondary)}
.row-val--warn{color:var(--mra-warning)} .row-val--error{color:var(--mra-danger)}

.toggle{display:flex;align-items:center;gap:6px;width:calc(100% + 16px);
  margin:10px var(--rail) 0;padding:8px;border:0;border-radius:5px;background:transparent;
  font-family:inherit;font-size:11.5px;color:var(--mra-foreground-secondary);cursor:pointer;
  text-align:left}
.toggle:hover{background:var(--mra-surface-hover)}
.toggle .chev{width:10px;height:10px;flex:none;color:var(--mra-foreground-dim);
  transition:transform .18s ease}
.toggle.open .chev{transform:rotate(90deg)}
.dim{color:var(--mra-foreground-dim)}

.panel{display:none;margin:4px var(--rail) 0}
.panel.open{display:block;max-height:224px;overflow-y:auto;
  scrollbar-width:none;-ms-overflow-style:none}
.panel::-webkit-scrollbar{width:0;height:0}
.trow{display:grid;grid-template-columns:1fr 44px 38px 54px;align-items:center;gap:10px;
  padding:5px 8px}
.tname{font-size:11.5px;color:var(--mra-foreground-secondary);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tbar{height:3px;border-radius:2px;background:var(--mra-border-light);overflow:hidden}
.tbar>i{display:block;height:100%;border-radius:2px;background:var(--mra-info)}
.tbar>i.warn{background:var(--mra-warning)}
.tnum{font-size:11px;font-variant-numeric:tabular-nums;text-align:right;
  color:var(--mra-foreground)}
.thz{font-size:11px;font-variant-numeric:tabular-nums;text-align:right;
  color:var(--mra-foreground-secondary)}
.thz.is-null{color:var(--mra-foreground-dim)}
.tsum{margin-top:6px;padding:7px 8px 0;border-top:1px dashed var(--mra-border-light);
  font-size:10.5px;color:var(--mra-foreground-dim)}
</style>
</head>
<body>
<div class="stage">
  <div class="toolbar">
    <span class="toolbar-title">性能监控卡</span>
    <div class="seg">
      <button data-mode="collapsed" class="on">折叠</button>
      <button data-mode="expanded">展开线程</button>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h3>性能监控</h3>
      <span class="head-state" id="headState"></span>
    </div>
    <div class="card-body" id="body"></div>
  </div>
</div>

<script>
const SYS = {
  host:{label:'整机占用 · 12 核', value:38, level:'ok',   hist:[31,34,33,37,41,39,36,34,37,40,38,38]},
  self:{label:'本程序',           value:64, level:'warn', hist:[58,61,63,60,66,68,65,62,67,66,64,64]}
};
const MODULE_ROWS = [
  {label:'驾驶拍率', value:'12.4 次/秒', level:'ok'},
  {label:'决策实况', value:'DRIVING · 保持车道', level:'ok', text:true}
];
const THREADS = [
  {alias:'深度链', name:'depth-worker', cpu:18.2, hz:5.1},
  {alias:'录制', name:'rec-frames', cpu:8.4, hz:30.0},
  {alias:'推理池', name:'native#4a1c', cpu:6.8, hz:null},
  {alias:'HUD 写盘', name:'hud-write', cpu:3.1, hz:4.0},
  {alias:'车道观测', name:'lane-obs', cpu:2.6, hz:12.0},
  {alias:'模型预加载', name:'model-preload', cpu:1.2, hz:null},
  {alias:'采样器', name:'perf-sampler', cpu:0.4, hz:1.0}
];

const RANK = {ok:0, idle:0, warn:1, error:2};
const COLOR = {ok:'#10B981', warn:'#F59E0B', error:'#EF4444', idle:'#B0B7C3'};
const LABEL = {ok:'正常', warn:'偏高', error:'异常', idle:'空闲'};
const CHEV = '<svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M3.5 1.5L7 5l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const spark = (vals, w, h, color) => {
  const max = Math.max(...vals), min = Math.min(...vals), span = (max-min)||1;
  const pad = 2;
  const pts = vals.map((v,i) => [(i/(vals.length-1))*w, h-pad-((v-min)/span)*(h-pad*2)]);
  const line = pts.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return `<svg class="kpi-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <polygon points="0,${h} ${line} ${w},${h}" fill="${color}14"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.4"
      vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
};

const levels = [SYS.host.level, SYS.self.level, ...MODULE_ROWS.map(r => r.level)];
const worst = levels.reduce((a,b) => RANK[b] > RANK[a] ? b : a, 'ok');
const off = levels.filter(l => l === 'warn' || l === 'error').length;
const head = document.getElementById('headState');
head.className = 'head-state head-state--' + worst;
head.innerHTML = `<i></i>${LABEL[worst]}${off > 1 ? `<b>${off} 项</b>` : ''}`;

const kpi = (d) => `
  <div class="kpi">
    <div class="kpi-label">${d.label}</div>
    <div class="kpi-num ${d.level !== 'ok' ? 'kpi-num--' + d.level : ''}">
      <b>${d.value}</b><span>%</span></div>
    ${spark(d.hist, 200, 28, COLOR[d.level])}
  </div>`;

document.getElementById('body').innerHTML = `
  <div class="kpis">${kpi(SYS.host)}${kpi(SYS.self)}</div>

  <div class="rule"></div>

  <div class="sect"><span class="sect-title">模块指标</span><span class="sect-meta">极速狂飙</span></div>
  <div class="rows">
    ${MODULE_ROWS.map(r => `
      <div class="row">
        <span class="row-label">${r.label}</span>
        <span class="row-val ${r.text ? 'row-val--text' : ''} ${r.level !== 'ok' ? 'row-val--' + r.level : ''}">${r.value}</span>
      </div>`).join('')}
  </div>

  <button class="toggle" id="toggle" aria-expanded="false">
    ${CHEV}线程明细<span class="dim">· ${THREADS.length + 2}</span>
  </button>
  <div class="panel" id="panel">
    ${THREADS.map(t => `
      <div class="trow" title="${t.name}">
        <span class="tname">${t.alias}</span>
        <span class="tbar"><i class="${t.cpu >= 15 ? 'warn' : ''}" style="width:${Math.min(100, t.cpu / 20 * 100)}%"></i></span>
        <span class="tnum">${t.cpu.toFixed(1)}%</span>
        <span class="thz ${t.hz === null ? 'is-null' : ''}">${t.hz === null ? '—' : t.hz.toFixed(1) + '/秒'}</span>
      </div>`).join('')}
    <div class="tsum">其余 2 个线程合计 0.3%</div>
  </div>
`;

const toggle = document.getElementById('toggle');
const panel = document.getElementById('panel');
const setMode = (open) => {
  toggle.classList.toggle('open', open);
  panel.classList.toggle('open', open);
  toggle.setAttribute('aria-expanded', String(open));
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on',
    (b.dataset.mode === 'expanded') === open));
};
toggle.addEventListener('click', () => setMode(!panel.classList.contains('open')));
document.querySelectorAll('.seg button').forEach(b =>
  b.addEventListener('click', () => setMode(b.dataset.mode === 'expanded')));
</script>
</body>
</html>
