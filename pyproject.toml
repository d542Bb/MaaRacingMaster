[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maaracing-master"
dynamic = ["version"]
description = "模块化游戏自动化平台 — MAA Framework + YOLOv8 ONNX + vgamepad，主打巅峰鉴宝"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python",
    "onnxruntime-directml",
    "vgamepad",
    "windows-capture",
    "MaaFw",
]

[project.optional-dependencies]
# CI（test.yml / release.yml）不直接采用本 extra：安装 [test] 会连带安装主依赖，
# 其中 onnxruntime-directml / windows-capture 仅 Windows 有 wheel，Linux runner 装不上，
# 故 CI 只 `pip install pytest`。此处 extra 保留，便于本地 `pip install -e .[test]`。
test = [
    "pytest>=7.0",
]
# 训练/导出模型所用（tools/training/train.py）。运行时推理走 onnxruntime-directml，
# 不依赖 ultralytics/torch，故作为可选 extra 避免发布包拽入 torch。
train = [
    "ultralytics>=8.4.92",
]

[tool.setuptools.packages.find]
include = ["maaracing_master*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 单测只覆盖纯逻辑模块，避免拉入 maa/opencv 等重量级依赖
addopts = "-ra"
python_files = ["test_*.py", "*_test.py"]

[tool.setuptools_scm]
write_to = "maaracing_master/_version.py"
